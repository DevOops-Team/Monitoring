# 모니터링 VM (172.30.0.30) 1차 스택. 운영 절차는 README.md
# 공통 로그 제한: 컨테이너 로그로 디스크가 차는 것만 막음
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  prometheus:
    image: prom/prometheus:v3.15.1
    restart: unless-stopped
    logging: *default-logging
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=60GB
      - --web.enable-remote-write-receiver   # 워커·매니저 Prometheus Agent가 여기로 밀어 넣음
      - --web.enable-lifecycle               # 설정 바꾼 뒤 POST /-/reload 로 재적용
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"  # 호스트 네트워크에서 도는 node-exporter 스크레이프용

  alertmanager:
    image: prom/alertmanager:v0.34.2
    restart: unless-stopped
    logging: *default-logging
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
      - ./secrets:/run/secrets:ro            # slack_webhook_url · healthchecks_ping_url (VM에만 있음)
      - alertmanager-data:/alertmanager
    ports:
      - "9093:9093"

  grafana:
    image: grafana/grafana:13.3.0
    restart: unless-stopped
    logging: *default-logging
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"

  node-exporter:
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    logging: *default-logging
    # 호스트의 네트워크·PID 공간을 그대로 봐야 VM 지표가 정확함 (node_exporter 공식 권장)
    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    restart: unless-stopped
    logging: *default-logging
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    # 포트는 compose 내부망에서만 (prometheus → cadvisor:8080)

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
