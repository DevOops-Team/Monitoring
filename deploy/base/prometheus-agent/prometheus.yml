# 모니터링 클러스터 안의 Prometheus Agent. 긁어서 Mimir로 remote_write만 한다(저장·룰 없음).
# 대상 둘: ① 이 클러스터 자신(kubelet · cAdvisor · node-exporter · 스택) ② LAN 서버(Proxmox 호스트 · Kafka)
global:
  scrape_interval: 15s      # dcgm-exporter 내부 수집 5s + scrape 15s 전제 (fault-event ±45s 창)
  external_labels:
    site: onprem            # cluster 라벨은 클러스터 안 대상에만 아래 relabel로 붙인다(LAN 서버엔 없음)

remote_write:
  - url: http://mimir.monitoring.svc.cluster.local:9009/api/v1/push

scrape_configs:
  - job_name: prometheus-agent
    static_configs:
      - targets: ["localhost:9090"]
        labels: {cluster: monitoring}

  # --- 이 클러스터 자신 ---
  # kubelet: 노드마다 하나. 인증은 ServiceAccount 토큰.
  # kubelet 서버 인증서가 자체 서명이라 검증을 건너뛴다(insecure_skip_verify). 없애려면 IaC inventory에서
  # kubelet serving 인증서를 클러스터 CA로 발급(kubelet_rotate_server_certificates + CSR 승인자)해야 한다 → 후속 과제
  - job_name: kubelet
    scheme: https
    kubernetes_sd_configs:
      - role: node
    authorization:
      credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    tls_config:
      insecure_skip_verify: true
    relabel_configs:
      - {target_label: cluster, replacement: monitoring}
      - {source_labels: [__meta_kubernetes_node_name], target_label: node}

  # 컨테이너 자원 지표. compose의 cAdvisor 컨테이너 대신 kubelet에 내장된 것을 쓴다
  - job_name: cadvisor
    scheme: https
    metrics_path: /metrics/cadvisor
    honor_timestamps: false   # cAdvisor가 붙여 주는 타임스탬프를 쓰면 out-of-order로 버려지는 샘플이 생긴다. 긁은 시각을 쓴다
    kubernetes_sd_configs:
      - role: node
    authorization:
      credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    tls_config:
      insecure_skip_verify: true
    relabel_configs:
      - {target_label: cluster, replacement: monitoring}
      - {source_labels: [__meta_kubernetes_node_name], target_label: node}

  # node-exporter DaemonSet. job 이름을 compose 때와 같게 두어 룰(self.yml)을 그대로 쓴다
  - job_name: node-exporter
    kubernetes_sd_configs:
      - role: endpointslice
        namespaces: {names: [monitoring]}
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_label_app_kubernetes_io_name]
        regex: prometheus-node-exporter
        action: keep
      - {target_label: cluster, replacement: monitoring}
      - {source_labels: [__meta_kubernetes_endpointslice_endpoint_topology_kubernetes_io_hostname], target_label: node}
      - {source_labels: [__meta_kubernetes_pod_node_name], regex: (.+), target_label: node}

  - job_name: mimir
    static_configs:
      - targets: ["mimir.monitoring.svc.cluster.local:9009"]
        labels: {cluster: monitoring}

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager.monitoring.svc.cluster.local:9093"]
        labels: {cluster: monitoring}

  - job_name: grafana
    static_configs:
      - targets: ["grafana.monitoring.svc.cluster.local:3000"]
        labels: {cluster: monitoring}

  - job_name: loki
    static_configs:
      - targets: ["loki.monitoring.svc.cluster.local:3100"]
        labels: {cluster: monitoring}

  - job_name: tempo
    static_configs:
      - targets: ["tempo.monitoring.svc.cluster.local:3200"]
        labels: {cluster: monitoring}

  - job_name: blackbox-exporter
    static_configs:
      - targets: ["blackbox-exporter.monitoring.svc.cluster.local:9115"]
        labels: {cluster: monitoring}

  # --- 밖에서 찔러 보기 (blackbox_exporter 경유). 대상 주소가 instance 라벨이 된다 ---
  # pfSense LAN 게이트웨이와 인터넷(공인 DNS). VPN 터널 · 워커 쪽은 AWS 재구축 뒤 대상만 추가
  - job_name: blackbox-icmp
    metrics_path: /probe
    params:
      module: [icmp]
    static_configs:
      - targets: ["172.30.0.1"]
        labels: {target_name: pfsense-lan}
      - targets: ["1.1.1.1"]
        labels: {target_name: internet}
    relabel_configs:
      - {source_labels: [__address__], target_label: __param_target}
      - {source_labels: [__param_target], target_label: instance}
      - {target_label: __address__, replacement: "blackbox-exporter.monitoring.svc.cluster.local:9115"}

  # --- LAN 서버 (compose/prometheus/prometheus.yml에서 그대로 옮김) ---
  # Proxmox 호스트 5대 (하드웨어 층). 호스트 OS에 직접 설치된 node-exporter를 LAN에서 긁음
  - job_name: pve-host
    static_configs:
      - targets: ["172.30.0.90:9100"]
        labels: {host: devoops}
      - targets: ["172.30.0.91:9100"]
        labels: {host: pve1}
      - targets: ["172.30.0.92:9100"]
        labels: {host: pve2}
      - targets: ["172.30.0.93:9100"]
        labels: {host: pve3}
      - targets: ["172.30.0.94:9100"]
        labels: {host: pve4}

  # Kafka 브로커 자체 지표 (JMX Exporter javaagent, 현수 설치 11/05). 원본은 약 1만 줄이라 필요한 것만 남긴다
  - job_name: kafka-jmx
    static_configs:
      - targets: ["172.30.0.40:7071"]
        labels: {host: kafka}
    metric_relabel_configs:
      # 1) 이름으로 1차 선별
      - source_labels: [__name__]
        regex: "kafka_network_requestmetrics_99thpercentile|kafka_server_brokertopicmetrics_oneminuterate|kafka_server_replicamanager_value|kafka_controller_kafkacontroller_value|kafka_log_log_value|kafka_server_kafkarequesthandlerpool_oneminuterate|jvm_memory_bytes_used|jvm_memory_pool_used_bytes|jvm_gc_collection_seconds_(count|sum)|jvm_threads_current|process_(cpu_seconds_total|open_fds|resident_memory_bytes)"
        action: keep
      # 2) 요청 지연은 Produce · FetchConsumer의 TotalTimeMs p99만 (원본 8,400줄 → 2줄).
      #    RE2엔 부정 탐색이 없어 "남길 것을 새 이름으로 옮긴 뒤 원래 이름을 전부 버리는" 두 단계로 한다
      - source_labels: [__name__, name, request]
        regex: "kafka_network_requestmetrics_99thpercentile;TotalTimeMs;(Produce|FetchConsumer)"
        target_label: __name__
        replacement: kafka_request_total_time_ms_p99
      - source_labels: [__name__]
        regex: "kafka_network_requestmetrics_99thpercentile"
        action: drop
