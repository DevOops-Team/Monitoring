# 커널 로그 경로 Xid 룰 (GPU-218, MON-STD-04). 드라이버가 커널 로그에 남기는 `NVRM: Xid` 줄 하나 = 알람 하나.
# 같은 Xid를 dcgm-exporter 지표로 잡는 룰은 deploy/base/mimir/rules/failover.yml의 FailoverXidDcgm이고,
# 분류기가 두 경로를 dedup_key(대상|Xid|±45초)로 한 사건에 묶는다 (docs/classifier.md 2절 라벨 계약)
#
# 줄 형식은 NVIDIA 문서 기준이다: `NVRM: Xid (PCI:0000:00:1e): 79, pid=1234, name=python, ...`
#   실제 줄은 아직 한 번도 못 봤다 → 형식이 다르면 이 룰만 조용히 안 울린다(FailoverXidDcgm은 그대로). 다음 EKS 주입에서 원문 확인
# 검증: scripts/loki-rules-e2e.sh (로컬 Loki에 합성 줄을 넣어 알람 모양과 분류기 파싱을 본다. CI `rules · test`가 돌린다)
#
# 이 파일은 지우지 말 것: loki-rules ConfigMap을 Loki Pod가 마운트하므로 파일이 하나도 없으면 ConfigMap을 만들 수 없다
groups:
  - name: failover-xid-kernel
    # Loki 기본 평가 주기는 1분. 커널 로그 경로는 빠른 것이 장점이라 15초로 둔다
    interval: 15s
    rules:
      # - EKS만 본다: GPU는 EKS에만 있다. 온프레 노드 커널 로그에 같은 문구가 찍혀도 사건이 되지 않는다
      # - 줄 시각(event_ts)과 원문(log_line)은 집계하면 사라지므로 라벨에 실어 꺼낸다 → 줄마다 알람이 따로 생긴다
      # - 창 2분: 줄이 Loki에 늦게 도착해도(EKS → VPN → 온프레) 1분 45초까지는 잡는다. 그 대신 알람이 2분 동안 울린다
      #   (같은 줄이면 라벨이 같아 같은 알람이고, Alertmanager 재전송은 분류기가 중복으로 버린다)
      # - gpu_uuid는 안 보낸다: 줄에는 PCI 주소뿐이다. 분류기가 노드로 dcgm-exporter 라벨에서 찾는다(g4dn은 노드당 GPU 1장)
      - alert: FailoverXidKernel
        expr: |
          sum by (cluster, node, xid, event_ts, log_line) (
            count_over_time(
              {service_name="kernel", k8s_cluster_name=~"eks-(a|b|c)"} |= "NVRM: Xid"
                | regexp `NVRM: Xid \(PCI:[0-9a-fA-F:.]+\): (?P<xid>[0-9]+)`
                | xid != ""
                | label_format cluster=`{{ .k8s_cluster_name }}`, node=`{{ .k8s_node_name }}`, event_ts=`{{ (__timestamp__).UTC.Format "2006-01-02T15:04:05Z" }}`, log_line=`{{ __line__ }}`
              [2m]
            )
          ) > 0
        labels:
          pipeline: failover
          signal: xid
          source: dmesg
        annotations:
          event_ts: '{{ $labels.event_ts }}'
          log_line: '{{ $labels.log_line }}'
          summary: 'Xid {{ $labels.xid }} (커널 로그): {{ $labels.cluster }} {{ $labels.node }}'
