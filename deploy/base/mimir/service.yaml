# 클러스터 안에서 쓰는 주소: http://mimir.monitoring.svc:9009
apiVersion: v1
kind: Service
metadata:
  name: mimir
  labels:
    app.kubernetes.io/name: mimir
spec:
  selector:
    app.kubernetes.io/name: mimir
  ports:
    - {name: http, port: 9009, targetPort: http}
    - {name: grpc, port: 9095, targetPort: grpc}
---
# memberlist 가십용. 준비 안 된 Pod도 서로를 찾아야 링이 만들어진다
apiVersion: v1
kind: Service
metadata:
  name: mimir-headless
  labels:
    app.kubernetes.io/name: mimir
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: mimir
  ports:
    - {name: gossip, port: 7946, targetPort: gossip}
---
# 클러스터 밖(워커 EKS · 관리 클러스터 Agent의 remote_write, 노트북 조회)에서 쓰는 주소: 172.30.0.35:9009
# 서비스 VIP 하나를 여러 Service가 포트로 공유한다 (docs/monitoring-cluster.md 1절)
apiVersion: v1
kind: Service
metadata:
  name: mimir-external
  labels:
    app.kubernetes.io/name: mimir
  annotations:
    kube-vip.io/loadbalancerIPs: "172.30.0.35"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Cluster
  selector:
    app.kubernetes.io/name: mimir
  ports:
    - {name: http, port: 9009, targetPort: http}
