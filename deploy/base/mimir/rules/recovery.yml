# 복구 컨트롤러가 사람에게 넘긴 사건(HOLD)을 Slack으로 알린다. 경로 = 컨트롤러 지표 → Agent → Mimir 룰 → Alertmanager (11/11 회의 결정).
# 지표: recovery_hold_total{job_id, reason} (platform/recovery-controller :8080, 새 HOLD 판정 1회당 +1. 전역 Watchdog HOLD는 job_id="")
groups:
  - name: recovery
    rules:
      # 세 절을 or로 묶는다.
      #  1) 이미 있던 시계열이 5분 안에 늘었다
      #  2) 새 시계열이다: 카운터는 첫 HOLD 때 값 1로 태어나서 increase()로는 0으로 보인다(첫 HOLD 누락)
      #     "새것" 판정은 5분 전 기준 직전 1시간에 샘플이 없었는지로 한다. 그냥 offset 5m만 쓰면
      #     Agent 수집이 몇 분 끊겼다 돌아올 때 옛 HOLD가 전부 새것으로 보여 다시 울린다
      # unless는 instance·pod까지 맞춰 본다(sum 전): 컨트롤러가 재시작하면 카운터가 0부터라, 같은 job·reason이어도 새 Pod의 시계열은 새 HOLD다
      #  3) 컨테이너만 재시작한 경우(같은 Pod, 같은 instance): 2)의 1시간 기준이 옛 프로세스의 샘플을 보고 "원래 있던 것"으로 착각한다
      #     → 프로세스가 최근 1시간 안에 시작했으면 "5분 전에 없었으면 새것"이라는 단순 기준을 쓴다 (process_start_time_seconds는 prometheus_client 기본 노출)
      #     대가: 재시작 뒤 1시간 안에 수집 공백까지 겹치면 옛 HOLD가 한 번 다시 울린다
      # 알람은 HOLD 뒤 약 5분 발화하고 꺼진다. 꺼짐 = 해결이 아니므로 Alertmanager에서 resolved 알림을 보내지 않는다
      - alert: RecoveryHold
        expr: >
          sum by (cluster, job_id, reason) (
              increase(recovery_hold_total[5m]) > 0
            or
              (recovery_hold_total unless last_over_time(recovery_hold_total[1h] offset 5m))
            or
              (
                  (recovery_hold_total unless recovery_hold_total offset 5m)
                and on (cluster, instance)
                  (time() - process_start_time_seconds < 3600)
              )
          )
        labels:
          severity: critical
        annotations:
          summary: '자동 복구 보류(HOLD): {{ if $labels.job_id }}job {{ $labels.job_id }}{{ else }}전역(Watchdog){{ end }} · 사유 {{ $labels.reason }} — 사람 확인 필요'
          standard: MON-STD-25

      # 펜싱 하트비트 멈춤 (ADR-44 · MON-STD-28). 지표: recovery_fencing_heartbeat_age_seconds{job_id, generation}
      # (컨트롤러가 30초마다 펜싱 테이블을 Scan, 조회 실패 · 오래된 스냅샷이면 시계열을 아예 안 낸다 → 조회 실패 중엔 이 알람도 조용하다)
      # min by: 컨트롤러 Pod 3개가 각자 내므로 하나라도 새 값을 보면 멈춤이 아니다(합산 금지)
      # 학습 중인 것만: 끝난 작업도 테이블에 남으므로(TTL 없음) trainer가 Running인 Pod의 job_id · 세대와 맞을 때만 울린다. 옛 세대 항목도 여기서 걸러진다
      # 60초 = 하트비트 주기 10초 × 6 (ADR-44 시작값). 정상도 하트비트 10초 + Scan 30초로 최대 약 40초까지 간다. for 1m = 사이드카가 일시 오류로 한두 번 건너뛰는 몫
      - alert: RecoveryHeartbeatStale
        # 학습 Pod 쪽을 왼쪽(many)에 둔다: 같은 job · 세대가 두 클러스터에 동시에 떠 있어도 many-to-many 오류로
        # 룰 전체가 평가 실패하지 않고 클러스터마다 하나씩 울린다. 값은 오른쪽 age (1 × age)
        expr: >
          group by (job_id, generation, cluster) (
            label_replace(
              label_replace(
                  kube_pod_labels{namespace="training", label_devoops_job_id!=""}
                and on (cluster, namespace, pod)
                  (kube_pod_container_status_running{container="trainer"} == 1),
                "job_id", "$1", "label_devoops_job_id", "(.+)"),
              "generation", "$1", "label_devoops_generation", "(.+)")
          )
          * on (job_id, generation) group_left ()
            (min by (job_id, generation) (recovery_fencing_heartbeat_age_seconds) > 60)
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: '펜싱 하트비트 멈춤: job {{ $labels.job_id }} · 세대 {{ $labels.generation }} ({{ $labels.cluster }}) — {{ $value | humanizeDuration }}째 안 찍힘. 새 체크포인트가 승인되지 않고 있을 수 있다'
          standard: MON-STD-28

      # 위 알람은 조회 실패 중 꺼진다. 그 빈틈을 알린다: 컨트롤러 Pod 전부가 10분째 펜싱 테이블을 못 읽음
      # (IAM 권한 · 온프레 → DynamoDB 인터넷 경로 · 인증 사이드카)
      - alert: RecoveryHeartbeatReadFailing
        expr: max by (cluster) (recovery_fencing_heartbeat_scrape_success) == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: '복구 컨트롤러가 펜싱 하트비트를 10분째 못 읽는다 — 그동안 하트비트 멈춤 알람(RecoveryHeartbeatStale)이 꺼져 있다'
          standard: MON-STD-28

      # 복구 컨트롤러 자체의 이상 (MON-STD-29). 사람용(Slack)이고 분류기 입력이 아니다.
      # 컨트롤러가 멈추면 gpu.fault가 나가도 복구가 시작되지 않는다. 11/24 ~ 11/25 사고 세 가지를 하나씩 잡는다

      # 1) Ready가 하나도 없다 (11/25 11:00 설정 불일치로 CrashLoop). 2분 = 버전 교체(한 개씩 바꿈) 중엔 0이 되지 않는다
      - alert: RecoveryControllerDown
        expr: >
          (kube_deployment_status_replicas_available{cluster="onprem-manager", namespace="platform", deployment="recovery-controller"} == 0)
          and (kube_deployment_spec_replicas{cluster="onprem-manager", namespace="platform", deployment="recovery-controller"} > 0)
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: '복구 컨트롤러 Ready 0개 — gpu.fault가 나가도 자동 복구가 시작되지 않는다'
          standard: MON-STD-29

      # 2) 죽었다 살아나기를 되풀이한다 (11/24 밤: 못 읽는 사건 하나에 스레드가 죽어 17시간 동안 15분마다 6 ~ 9번).
      # 그사이 Ready로 보이는 때가 있어 1)로는 안 잡힌다. Pod 3개 합계 3번 = 한 바퀴. 버전 교체는 새 Pod라 재시작 수가 늘지 않는다
      - alert: RecoveryControllerRestarting
        expr: >
          sum by (cluster, namespace) (
            increase(kube_pod_container_status_restarts_total{cluster="onprem-manager", namespace="platform", pod=~"recovery-controller-.*"}[15m])
          ) >= 3
        labels:
          severity: warning
        annotations:
          summary: '복구 컨트롤러가 15분 동안 {{ $value | printf "%.0f" }}번 재시작 — 같은 사건에서 계속 죽고 있을 수 있다. 로그의 마지막 오류와 gpu.fault 소비 지연 확인'
          standard: MON-STD-29

      # 3) gpu.fault를 못 읽고 있다 (11/25 17:00: 같은 사건을 19분 동안 되풀이해 읽음). 평소 지연은 0이고 사건 하나는 몇 초 안에 읽는다.
      # 커밋한 적 없는 파티션은 -1이라 0 이상만 합친다
      - alert: RecoveryControllerStuck
        expr: >
          sum by (consumergroup, topic) (
            kafka_consumergroup_lag{job="kafka-exporter", consumergroup="recovery-controller-v1", topic="gpu.fault"} >= 0
          ) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: '복구 컨트롤러가 gpu.fault {{ $value }}건을 5분째 못 읽는다 — 그 사건과 뒤따르는 사건의 복구가 멈춰 있다'
          standard: MON-STD-29
