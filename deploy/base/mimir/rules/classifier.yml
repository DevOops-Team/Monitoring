# 분류기 자체의 이상 (MON-STD-27). 사람용(Slack)이고 분류기 입력이 아니다.
# 분류기가 멈추면 원인 알람이 떠도 gpu.fault가 나가지 않아 자동 복구가 시작되지 않는다
groups:
  - name: classifier
    rules:
      # up == 0이 아니라 absent(... == 1)로 본다: Agent가 Pod를 찾아 긁으므로 Pod가 아예 없으면 up 시계열도 없어
      # MonitoringTargetDown(up == 0)이 울리지 않는다. 이 식은 「Pod 없음」과 「긁기 실패」를 둘 다 잡는다.
      # 3분은 버전을 올릴 때(Recreate + Kafka에서 기억 복원)와 Agent 재시작 구간에 울리지 않게 둔 여유다
      - alert: ClassifierDown
        expr: absent(up{job="classifier", cluster="monitoring"} == 1)
        for: 3m
        labels:
          severity: critical
          # absent()는 비교식이 끼면 고른 라벨을 결과에 싣지 않는다. 다른 알람과 같게 보이도록 직접 적는다
          job: classifier
          cluster: monitoring
        annotations:
          summary: '분류기가 없거나 지표가 안 긁힌다 — gpu.fault가 나가지 않아 자동 복구가 시작되지 않는다'
          standard: MON-STD-27

      # 0인 동안 Pod 종료 신호는 전부 hold로 나간다. 메시지 반영 실패로 0이 된 경우는 재시작 전까지 돌아오지 않는다
      - alert: ClassifierLifecycleUnhealthy
        expr: classifier_lifecycle_healthy{job="classifier"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: '분류기({{ $labels.pod }})가 job.lifecycle을 못 읽는다 — Pod 종료 신호가 전부 hold로 나간다. 안 돌아오면 분류기 재시작'
          standard: MON-STD-27
