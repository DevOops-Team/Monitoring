# 학습 작업 자체의 이상 (MON-STD-30). 사람용(Slack)이고 분류기 입력이 아니다.
groups:
  - name: training
    rules:
      # trainer가 떠 있는데 학습이 안 나아간다: 그 작업 · 세대의 train_current_step(trainer :8000)이 10분째 한 번도 안 늘었거나 아예 안 들어온다.
      # 복구 뒤 「Pod는 전부 Ready(job.resumed)인데 학습은 안 도는」 경우를 잡으려고 만들었다(11/25 주입 뒤 세대 2: Pod는 8 ~ 10분 떠 있었고 step 지표는 0건).
      # 복구 뒤 세대만이 아니라 모든 세대를 본다 — 세대 1이 멈춘 것도 같은 문제다.
      #  · 왼쪽 = trainer가 Running인 Pod의 작업 · 세대(RecoveryHeartbeatStale과 같은 방식)
      #  · unless = 최근 2분 안에 step이 한 번이라도 바뀐 작업 · 세대는 뺀다. 랭크 하나만 나아가도 진행으로 본다(랭크는 같이 나아간다)
      #  · for 10m = 「10분째」. 11/25 정상 작업 5개는 trainer 시작 뒤 15 ~ 30초 안에 첫 step이 늘었고 도중 정체는 0초였다. 10분은 가설
      # EKS 수집이 통째로 끊기면(VPN · Agent) 왼쪽도 같이 사라져 울리지 않는다(그 경우는 사이트 알람 몫)
      - alert: TrainingStalled
        expr: >
          group by (cluster, job_id, generation) (
            label_replace(
              label_replace(
                  kube_pod_labels{namespace="training", label_devoops_job_id!=""}
                and on (cluster, namespace, pod)
                  (kube_pod_container_status_running{container="trainer"} == 1),
                "job_id", "$1", "label_devoops_job_id", "(.+)"),
              "generation", "$1", "label_devoops_generation", "(.+)")
          )
          unless on (cluster, job_id, generation)
            (max by (cluster, job_id, generation) (changes(train_current_step[2m])) > 0)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: '학습이 안 나아간다: job {{ $labels.job_id }} · 세대 {{ $labels.generation }} ({{ $labels.cluster }}) — trainer는 떠 있는데 step이 10분째 그대로이거나 지표가 없다'
          standard: MON-STD-30
