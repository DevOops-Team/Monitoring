# 분류기가 읽는 원인 알람. 사람용이 아니다: Alertmanager가 pipeline=failover 라우트로 분류기에만 보낸다(values/alertmanager.yaml).
# 라벨 · annotation은 docs/classifier.md 2절 계약을 따른다. 버릴 신호(Xid 45 · 의도된 종료)는 여기서 거르지 않고 분류기가 거른다.
#
# 공통 원칙: 「상태」가 아니라 「사건」으로 울린다.
#  - 사건 직후 1~2분만 발화한다. 계속 발화하면 분류기가 같은 고장을 계속 받는다
#  - event_ts는 평가 시각이 아니라 원본 샘플 시각이고, 발화하는 동안 바뀌지 않는다.
#    분류기는 event_ts가 처음 본 값에서 45초 넘게 움직이면 다른 사건으로 본다(fault-event.md 2.1절)
# 스팟 회수 · 커널 로그 경로 Xid는 아직 없다(docs/classifier.md 8절). 스팟 회수로 노드가 사라지면 지금은 FailoverGpuNodeLost가 잡는다
groups:
  - name: failover
    rules:
      # Xid 사건. 두 경로 중 하나가 보면 1분만 울린다. GPU 단위(cluster · node · UUID)로 합쳐서 본다:
      # dcgm-exporter는 GPU를 쓰는 Pod 이름을 라벨로 붙여서, 학습 Pod가 죽으면 같은 값의 새 시계열이 생긴다. 합치지 않으면 그때 한 번 더 울린다.
      #  ① 횟수 경로(앞): DCGM_EXP_XID_ERRORS_COUNT = Xid 번호(xid 라벨)별 「최근 10분 안 횟수」. Xid마다 생기고 10분 뒤 빠진다(창, dcgm-exporter
      #     daemonset.yaml). 1분 전보다 늘었거나 1분 전엔 없었으면 새 사건 → 같은 번호가 다시 나도 잡는다(GPU-221)
      #     한계: 앞 Xid가 빠지고 15초(수집 주기) 안에 같은 번호가 다시 나면 빈 순간이 기록되지 않아 「1, 1」로 이어져 못 본다(간격 10분 ~ 10분 15초)
      #  ② 번호 경로(뒤): DCGM_FI_DEV_XID_ERRORS = 그 GPU에서 마지막으로 난 Xid 번호(없었으면 0). 값이 바뀌면 새 사건. 같은 번호 재발은 못 본다.
      #     횟수 지표가 안 나올 때를 위해 남긴다. 같은 GPU에 ①이 울리면 ②는 빠진다(or on) → 알람은 하나
      # 출처를 고정한다(monitoring 네임스페이스의 dcgm-exporter 컨테이너). 이 세 라벨은 Agent가 긁는 대상에서 붙이는 것이라
      # 지표를 내는 쪽이 정할 수 없다. 이름만 보면 학습 Pod(사용자 코드, :8000 /metrics)가 같은 이름의 지표를 내 장애를 꾸밀 수 있다
      - alert: FailoverXidDcgm
        expr: >
          (
            (max by (cluster, node, UUID, xid) (DCGM_EXP_XID_ERRORS_COUNT{job="annotated-pods", namespace="monitoring", container="dcgm-exporter", xid!=""}) > 0)
            unless
            (
                max by (cluster, node, UUID, xid) (DCGM_EXP_XID_ERRORS_COUNT{job="annotated-pods", namespace="monitoring", container="dcgm-exporter", xid!=""} offset 1m)
              >=
                max by (cluster, node, UUID, xid) (DCGM_EXP_XID_ERRORS_COUNT{job="annotated-pods", namespace="monitoring", container="dcgm-exporter", xid!=""})
            )
          )
          or on (cluster, node, UUID)
          (
            (max by (cluster, node, UUID) (DCGM_FI_DEV_XID_ERRORS{job="annotated-pods", namespace="monitoring", container="dcgm-exporter"}) != 0)
            unless
            (
                max by (cluster, node, UUID) (last_over_time(DCGM_FI_DEV_XID_ERRORS{job="annotated-pods", namespace="monitoring", container="dcgm-exporter"}[10m] offset 1m))
              ==
                max by (cluster, node, UUID) (DCGM_FI_DEV_XID_ERRORS{job="annotated-pods", namespace="monitoring", container="dcgm-exporter"})
            )
          )
        labels:
          pipeline: failover
          signal: xid
          source: dcgm
          # ①은 값이 횟수라 번호를 xid 라벨에서, ②는 값이 번호
          xid: '{{ with $labels.xid }}{{ . }}{{ else }}{{ $value }}{{ end }}'
          gpu_uuid: '{{ $labels.UUID }}'
        annotations:
          # 원본 샘플 시각. ① 그 횟수가 처음 찍힌 샘플(최근 1분 안 — 울리는 1분 동안 고정), ② 이 번호가 처음 찍힌 샘플(최근 2분 안)
          event_ts: >-
            {{ if $labels.xid }}{{ with printf "min_over_time(max by (cluster, node, UUID, xid) (timestamp(DCGM_EXP_XID_ERRORS_COUNT{job=\"annotated-pods\", namespace=\"monitoring\", container=\"dcgm-exporter\", cluster=%q, UUID=%q, xid=%q} == %v))[1m:15s])" $labels.cluster $labels.UUID $labels.xid $value | query }}{{ (. | first | value | toTime).UTC.Format "2006-01-02T15:04:05Z" }}{{ end }}{{ else }}{{ with printf "min_over_time(max by (cluster, node, UUID) (timestamp(DCGM_FI_DEV_XID_ERRORS{job=\"annotated-pods\", namespace=\"monitoring\", container=\"dcgm-exporter\", cluster=%q, UUID=%q} == %v))[2m:15s])" $labels.cluster $labels.UUID $value | query }}{{ (. | first | value | toTime).UTC.Format "2006-01-02T15:04:05Z" }}{{ end }}{{ end }}
          summary: 'Xid {{ with $labels.xid }}{{ . }}{{ else }}{{ $value }}{{ end }}: {{ $labels.cluster }} {{ $labels.node }} {{ $labels.UUID }}'

      # 학습 컨테이너(trainer)가 정상 완료가 아닌 사유로 끝난 뒤 90초만 울린다. ckpt-init · ckpt-sidecar는 보지 않는다.
      # 값 = 종료 시각(kube_pod_completion_time) → event_ts로 쓴다.
      # kube-state-metrics는 재시작하지 않는 컨테이너의 종료 코드를 내지 않아 사유(Error · OOMKilled …)만 보낸다
      # job="kube-state-metrics"로 출처를 고정한다(위 Xid 룰과 같은 이유)
      - alert: FailoverPodExit
        expr: >
          max by (cluster, namespace, pod, node, reason) (
              kube_pod_completion_time{job="kube-state-metrics", namespace="training"}
            * on (cluster, namespace, pod) group_left (reason)
              (kube_pod_container_status_terminated_reason{job="kube-state-metrics", namespace="training", container="trainer", reason!="Completed"} == 1)
            * on (cluster, namespace, pod) group_left (node)
              kube_pod_info{job="kube-state-metrics", namespace="training"}
          ) > time() - 90
        labels:
          pipeline: failover
          signal: pod_exit
        annotations:
          event_ts: '{{ ($value | toTime).UTC.Format "2006-01-02T15:04:05Z" }}'
          log_line: 'trainer terminated: {{ $labels.reason }}'
          summary: '학습 Pod 종료({{ $labels.reason }}): {{ $labels.cluster }} {{ $labels.pod }}'

      # 학습 작업(JobSet)이 실패로 끝났다. 위 FailoverPodExit이 못 보는 경우를 막는다(GPU-220):
      #   JobSet이 Failed가 되면 MultiKueue가 EKS 쪽 JobSet을 바로 지워 죽은 Pod가 약 14초만 보인다(수집 15초 → 한 번도 안 잡힐 수 있다.
      #   11/25 주입에서 워커 kill -9를 놓쳐 gpu.fault가 안 나갔다). 관리 클러스터의 JobSet은 Failed로 남으므로 그것을 본다.
      # 값 = Failed 조건이 된 시각(관리 클러스터 KSM, deploy/agents/overlays/onprem/ksm-custom-resources.yaml) → event_ts로 쓴다.
      # JobSet은 지워질 때까지 Failed로 남아서, 실패 시각이 최근 3분 안일 때만 울린다(사건으로 만든다. FailoverPodExit의 90초 창과 같은 방식)
      # cluster = 그 작업 · 세대의 학습 Pod가 최근 15분 안에 있던 EKS(관리 클러스터 JobSet에는 어느 EKS인지가 없다).
      #   Pod가 한 번도 안 떴으면(배정 전 실패) 붙일 cluster가 없어 울리지 않는다. 어느 랭크 · 노드가 죽었는지는 이 알람에 없다
      # 분류기가 작업마다 restart_in_place 1건을 낸다. 같은 작업 · 세대의 FailoverPodExit과 겹치면 먼저 온 쪽만 사건이 된다
      - alert: FailoverJobFailed
        expr: >
          (
              max by (job_id, generation) (
                kube_customresource_jobset_failed_time{job="kube-state-metrics", cluster="onprem-manager", namespace="training", job_id!="", generation!=""}
              )
            * on (job_id, generation) group_right ()
              group by (cluster, job_id, generation) (
                label_replace(label_replace(
                  last_over_time(kube_pod_labels{job="kube-state-metrics", cluster=~"eks-(a|b|c)", namespace="training", label_devoops_job_id!=""}[15m]),
                  "job_id", "$1", "label_devoops_job_id", "(.+)"), "generation", "$1", "label_devoops_generation", "(.+)")
              )
          ) > time() - 180
        labels:
          pipeline: failover
          signal: job_failed
        annotations:
          event_ts: '{{ ($value | toTime).UTC.Format "2006-01-02T15:04:05Z" }}'
          log_line: 'jobset failed: job-{{ $labels.job_id }} generation {{ $labels.generation }}'
          summary: '학습 작업 실패: {{ $labels.cluster }} {{ $labels.job_id }} 세대 {{ $labels.generation }}'

      # GPU 노드가 사라졌다: 최근 10분 안에 Ready였는데 지금은 Ready가 아니다(NotReady · Unknown · Node 삭제). 1분 이어지면 울린다.
      # GPU 노드만 죽고 CPU 노드(Agent · KSM)가 살아 있을 때를 위한 것이다. 이때 FailoverSiteDown은 지표가 계속 와서 안 울리고,
      #   FailoverPodExit은 Pod가 종료 사유 없이 사라져서 안 울린다(11/24 kind 재현). 지표까지 끊기면 FailoverSiteDown 몫이다.
      # 분류기가 노드마다 isolate_migrate 1건을 낸다(그 노드에 학습 작업이 있었을 때만). 같은 작업의 둘째 건부터는 컨트롤러가 닫는다.
      # GPU 노드 = KSM이 nvidia.com/gpu allocatable을 낸 노드. 「최근 10분 안에 Ready」 기준이라 NotReady가 이어져도 10분 뒤 꺼진다
      # 조건:
      #  - 그 클러스터 KSM이 지금 긁히고 있을 때만(up == 1). KSM이 죽으면 노드 지표가 한꺼번에 사라져 모든 노드가 죽은 것처럼 보인다
      #  - 일부러 내린 클러스터는 뺀다(FailoverSiteDown과 같은 식). 11/24 17:10 eks-a OFF 때 GPU 노드가 CPU 노드보다 12분 먼저 사라졌다
      #  - for 1m: kubelet이 잠깐 끊겼다 돌아오는 것은 울리지 않는다
      # job="kube-state-metrics"로 출처를 고정한다(위 Xid 룰과 같은 이유)
      - alert: FailoverGpuNodeLost
        expr: >
          (
            max by (cluster, node) (max_over_time(kube_node_status_condition{job="kube-state-metrics", cluster=~"eks-(a|b|c)", condition="Ready", status="true"}[10m])) == 1
            unless
            max by (cluster, node) (kube_node_status_condition{job="kube-state-metrics", cluster=~"eks-(a|b|c)", condition="Ready", status="true"} == 1)
          )
          and on (cluster, node)
          (max by (cluster, node) (max_over_time(kube_node_status_allocatable{job="kube-state-metrics", cluster=~"eks-(a|b|c)", resource="nvidia_com_gpu"}[10m])) > 0)
          and on (cluster)
          (max by (cluster) (up{job="kube-state-metrics", cluster=~"eks-(a|b|c)"}) == 1)
          unless on (cluster)
          label_replace(kube_customresource_multikueuecluster_info{fenced="true"}, "cluster", "$1", "name", "(.+)")
        for: 1m
        labels:
          pipeline: failover
          signal: node_lost
        annotations:
          # 마지막으로 Ready였던 샘플의 시각. 발화하는 동안 바뀌지 않는다
          event_ts: >-
            {{ with printf "max_over_time((timestamp(kube_node_status_condition{job=\"kube-state-metrics\", cluster=%q, node=%q, condition=\"Ready\", status=\"true\"}) and kube_node_status_condition{job=\"kube-state-metrics\", cluster=%q, node=%q, condition=\"Ready\", status=\"true\"} == 1)[15m:15s])" $labels.cluster $labels.node $labels.cluster $labels.node | query }}{{ (. | first | value | toTime).UTC.Format "2006-01-02T15:04:05Z" }}{{ end }}
          log_line: 'GPU node not Ready or deleted'
          summary: 'GPU 노드 소실: {{ $labels.cluster }} {{ $labels.node }}'

      # EKS 클러스터의 Agent 지표가 10분 안에는 왔는데 최근 2분 동안 하나도 없다. 마지막 샘플 뒤 2분~10분 사이에 울린다.
      # EKS는 켰다 껐다 하므로 「있다가 사라진 것」만 본다. 대상은 eks-a · b · c(3개 고정). 복구 컨트롤러가 다른 이름을 받으면 소비가 멈춘다.
      # 일부러 내린 클러스터는 뺀다: EKS OFF 절차가 내리기 전에 관리 클러스터 MultiKueueCluster에 devoops/fenced=true를 붙인다
      #   (지표는 deploy/agents/overlays/onprem/ksm-custom-resources.yaml). 진짜 사고 뒤 relocator가 같은 라벨을 붙이면 알람이 풀린다(사건은 이미 나감).
      # 온프레 인터넷(모니터링 클러스터 → 1.1.1.1 ping)이 최근 10분 안에 한 번이라도 실패했으면 울리지 않는다.
      #   온프레 인터넷 · EKS VPN이 같은 회선(pve4 Wi-Fi → pfSense WAN)을 지나서, 우리 쪽 회선이 끊기면 모든 EKS가 같이 끊겨 보인다.
      #   2026-11-24 15:30 pve4 Wi-Fi 작업 때 eks-a · b가 같이 울렸다(진짜 장애 아님). Agent가 버퍼에 쌓았다가 회선이 돌아오자 보내서
      #   나중에 보면 샘플 빈칸도 없다. 10분 = 이 알람이 울릴 수 있는 기간(마지막 샘플 뒤 2~10분) 전체를 덮는 길이
      # 한계: 관리 클러스터 KSM 지표가 없으면 거르지 못하고 울린다(놓치는 것보다 낫다). Agent 하나만 죽은 경우도 울린다.
      #   온프레 인터넷이 끊긴 동안 난 진짜 사이트 장애는 못 본다(그때는 우리 쪽 문제와 구분할 수 없다). 프로브 지표가 아예 없으면 거르지 않고 울린다.
      #   VPN 단절 · 사이트 장애 구분은 복구 컨트롤러 몫이다(fault-event.md 4절)
      - alert: FailoverSiteDown
        expr: >
          (
            count by (cluster) (last_over_time(up{job="prometheus-agent", cluster=~"eks-(a|b|c)"}[10m]))
            unless
            count by (cluster) (last_over_time(up{job="prometheus-agent", cluster=~"eks-(a|b|c)"}[2m]))
          )
          unless on (cluster)
          label_replace(kube_customresource_multikueuecluster_info{fenced="true"}, "cluster", "$1", "name", "(.+)")
          unless on ()
          (min(min_over_time(probe_success{job="blackbox-icmp", target_name="internet"}[10m])) == 0)
        labels:
          pipeline: failover
          signal: site
        annotations:
          # 마지막으로 도착한 샘플의 시각
          event_ts: >-
            {{ with printf "max_over_time(timestamp(up{job=\"prometheus-agent\", cluster=%q})[15m:15s])" $labels.cluster | query }}{{ (. | first | value | toTime).UTC.Format "2006-01-02T15:04:05Z" }}{{ end }}
          summary: '클러스터 수집 끊김: {{ $labels.cluster }}'
