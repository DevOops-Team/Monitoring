# 모니터링 클러스터 자기 감시 (MON-STD-22). compose/prometheus/rules/self.yml을 옮긴 것.
# 워커 지표 룰은 Agent가 붙은 뒤 별도 파일로. Mimir ruler가 평가해 Alertmanager로 보낸다
groups:
  - name: monitoring-self
    rules:
      # 항상 발화하는 데드맨 스위치. Alertmanager가 healthchecks.io로 1분마다 전달,
      # 끊기면(Agent·Mimir·Alertmanager·클러스터·인터넷 중 하나라도 죽음) healthchecks.io가 Slack에 알림
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: none
        annotations:
          summary: 모니터링 파이프라인 생존 신호 (항상 발화가 정상)
          standard: MON-STD-22

      # 쿠버 노드 전부(모니터링 · 관리 · EKS). /var/lib/kubelet은 EKS GPU 노드의 로컬 NVMe(RAID0)라 따로 잡힌다:
      # emptyDir(/ckpt · /data) · 이미지 · Pod 로그가 여기 쌓인다. 그 밖의 노드는 루트 안이라 시계열이 없다
      - alert: MonitoringNodeDiskWarning
        expr: >
          1 - node_filesystem_avail_bytes{job="node-exporter", mountpoint=~"/|/var/lib/kubelet"}
            / node_filesystem_size_bytes{job="node-exporter", mountpoint=~"/|/var/lib/kubelet"} > 0.80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.cluster }} 노드 {{ $labels.node }} 디스크 {{ $labels.mountpoint }} 80% 초과'
          standard: MON-STD-22

      - alert: MonitoringNodeDiskCritical
        expr: >
          1 - node_filesystem_avail_bytes{job="node-exporter", mountpoint=~"/|/var/lib/kubelet"}
            / node_filesystem_size_bytes{job="node-exporter", mountpoint=~"/|/var/lib/kubelet"} > 0.90
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: '{{ $labels.cluster }} 노드 {{ $labels.node }} 디스크 {{ $labels.mountpoint }} 90% 초과. 모니터링 노드면 Mimir·Loki PVC와 보존 설정, EKS면 체크포인트 · 이미지 확인'
          standard: MON-STD-22

      # 문구는 대상이 무엇인지 알 수 있게: Pod 대상이면 네임스페이스/Pod, 호스트 대상(pve · vm · pfSense · Kafka JMX)이면 host,
      # 그 밖은 job. node 라벨이 있으면 노드도. IP:포트(instance)는 Slack 템플릿이 뒤에 붙인다(deploy/values/alertmanager.yaml)
      - alert: MonitoringTargetDown
        expr: up == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: '스크레이프 대상 다운: {{ with $labels.host }}{{ $labels.job }} {{ . }}{{ else }}{{ with $labels.cluster }}{{ . }} · {{ end }}{{ with $labels.pod }}{{ $labels.namespace }}/{{ . }}{{ else }}{{ $labels.job }}{{ end }}{{ with $labels.node }} (노드 {{ . }}){{ end }}{{ end }}'
          standard: MON-STD-22

      # 모니터링 클러스터 워크로드의 Ready 수가 원하는 개수보다 적다(이중화 GPU-227). 개수를 적지 않고 spec과 비교해서
      # 개수를 바꿔도 룰은 그대로다. 10분: 3개짜리 StatefulSet을 한 개씩 교체하는 동안은 계속 「모자람」이라 짧으면 배포 때마다 울린다
      - alert: MonitoringReplicasDegraded
        expr: >
          label_replace(
            kube_statefulset_status_replicas_ready{cluster="monitoring", namespace="monitoring"}
              < kube_statefulset_replicas{cluster="monitoring", namespace="monitoring"},
            "workload", "$1", "statefulset", "(.+)")
          or
          label_replace(
            kube_deployment_status_replicas_available{cluster="monitoring", namespace="monitoring"}
              < kube_deployment_spec_replicas{cluster="monitoring", namespace="monitoring"},
            "workload", "$1", "deployment", "(.+)")
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: '모니터링 {{ $labels.workload }} Ready {{ $value }}개 — 원하는 개수보다 적다. 하나 더 죽으면 그 기능이 멈출 수 있다'
          standard: MON-STD-22

      # 하나도 Ready가 아니다 = 그 기능(저장 · 알람 · 분류 · 수집)이 멈췄다. 위 룰보다 짧게 본다
      - alert: MonitoringReplicasAllDown
        expr: >
          label_replace(
            (kube_statefulset_status_replicas_ready{cluster="monitoring", namespace="monitoring"} == 0)
              and (kube_statefulset_replicas{cluster="monitoring", namespace="monitoring"} > 0),
            "workload", "$1", "statefulset", "(.+)")
          or
          label_replace(
            (kube_deployment_status_replicas_available{cluster="monitoring", namespace="monitoring"} == 0)
              and (kube_deployment_spec_replicas{cluster="monitoring", namespace="monitoring"} > 0),
            "workload", "$1", "deployment", "(.+)")
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: '모니터링 {{ $labels.workload }} Ready 0개 — 그 기능이 멈췄다'
          standard: MON-STD-22
