apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mimir
  labels:
    app.kubernetes.io/name: mimir
spec:
  serviceName: mimir-headless
  replicas: 1                        # 3노드 확장 때 3 (mimir.yaml의 replication_factor와 함께)
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: mimir
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mimir
    spec:
      securityContext:
        fsGroup: 10001               # mimir 이미지의 실행 계정. PVC를 쓸 수 있게
        runAsUser: 10001
        runAsNonRoot: true
      terminationGracePeriodSeconds: 120   # 종료 때 ingester가 WAL을 블록으로 내려쓸 시간
      initContainers:
        # S3 임시 키 공급. restartPolicy: Always = 사이드카(Mimir보다 먼저 뜨고 Pod가 끝날 때까지 산다).
        # 인증서(Secret mimir-s3-cert)로 IAM Roles Anywhere에서 1시간짜리 키를 받아 127.0.0.1:9911에 내놓고 만료 전에 갱신한다
        - name: aws-credentials
          image: public.ecr.aws/rolesanywhere/credential-helper:1.8.5-2026.08.24.20.52
          restartPolicy: Always
          args:
            - serve
            - --port=9911
            - --certificate=/cert/client.pem
            - --private-key=/cert/client.key
            - --trust-anchor-arn=arn:aws:rolesanywhere:us-east-2:947027666399:trust-anchor/e64f2c94-9faa-4510-9e0d-b04c71170678
            - --profile-arn=arn:aws:rolesanywhere:us-east-2:947027666399:profile/dfe0b1b8-4e83-46eb-8cb9-c929e19a4828
            - --role-arn=arn:aws:iam::947027666399:role/devoops-prod-onprem-mimir
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 64Mi}
          volumeMounts:
            - {name: s3-cert, mountPath: /cert, readOnly: true}
      containers:
        - name: mimir
          image: grafana/mimir:3.2.4
          args:
            - -config.file=/etc/mimir/mimir.yaml
          env:
            # AWS SDK가 EC2 메타데이터 대신 사이드카에 키를 물어보게 한다
            - {name: AWS_EC2_METADATA_SERVICE_ENDPOINT, value: "http://127.0.0.1:9911"}
          ports:
            - {name: http, containerPort: 9009}
            - {name: grpc, containerPort: 9095}
            - {name: gossip, containerPort: 7946}
          readinessProbe:
            httpGet: {path: /ready, port: http}
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: {cpu: 200m, memory: 1Gi}
            limits: {memory: 2Gi}
          volumeMounts:
            - {name: config, mountPath: /etc/mimir/mimir.yaml, subPath: mimir.yaml}
            - {name: rules, mountPath: /etc/mimir/rules/anonymous}   # 테넌트 anonymous의 룰 디렉터리
            - {name: data, mountPath: /data}
      volumes:
        - name: config
          configMap: {name: mimir-config}
        - name: rules
          configMap: {name: mimir-rules}
        - name: s3-cert
          secret: {secretName: mimir-s3-cert}   # scripts/create-secrets.sh s3-certs
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi
