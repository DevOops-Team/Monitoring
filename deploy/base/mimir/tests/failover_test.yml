# promtool test rules. scripts/deploy-k8s.sh의 lint 단계가 돌린다
# 시각은 1970-01-01 00:00:00부터 센다. 샘플 간격 15초. 'ax20'은 21개(0초~5분), '_x21'은 빈 칸 21개 → 다음 값이 5분 15초
rule_files:
  - ../rules/failover.yml
evaluation_interval: 15s

tests:
  # 1) 5분 15초에 0 → 79. 1분만 울리고, 그동안 event_ts는 5분 15초에서 안 움직인다
  - name: Xid가 새로 찍히면 1분만 울리고 event_ts는 고정이다
    interval: 15s
    input_series:
      - series: 'DCGM_FI_DEV_XID_ERRORS{job="annotated-pods", namespace="monitoring", container="dcgm-exporter", cluster="eks-a", node="ip-10-0-1-23", UUID="GPU-aaaa", exported_pod="job-3f9a1c2e-g0001-workers-0-0"}'
        values: '0x20 79x40'
      - series: 'DCGM_FI_DEV_XID_ERRORS{job="annotated-pods", namespace="monitoring", container="dcgm-exporter", cluster="eks-a", node="ip-10-0-1-24", UUID="GPU-bbbb"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 5m
        alertname: FailoverXidDcgm
        exp_alerts: []
      - eval_time: 5m15s
        alertname: FailoverXidDcgm
        exp_alerts: &xid79
          - exp_labels: {pipeline: failover, signal: xid, source: dcgm, xid: "79", gpu_uuid: GPU-aaaa, cluster: eks-a, node: ip-10-0-1-23, UUID: GPU-aaaa}
            exp_annotations:
              event_ts: '1970-01-01T00:05:15Z'
              summary: 'Xid 79: eks-a ip-10-0-1-23 GPU-aaaa'
      - eval_time: 6m
        alertname: FailoverXidDcgm
        exp_alerts: *xid79
      - eval_time: 6m15s
        alertname: FailoverXidDcgm
        exp_alerts: []
      - eval_time: 12m
        alertname: FailoverXidDcgm
        exp_alerts: []

  # 2) Xid 뒤 학습 Pod가 죽어 dcgm-exporter 라벨(exported_pod)이 바뀐다 → 새 시계열이지만 같은 GPU · 같은 번호라 다시 울리지 않는다
  - name: 같은 GPU의 라벨만 바뀌면 다시 울리지 않는다
    interval: 15s
    input_series:
      - series: 'DCGM_FI_DEV_XID_ERRORS{job="annotated-pods", namespace="monitoring", container="dcgm-exporter", cluster="eks-a", node="ip-10-0-1-23", UUID="GPU-aaaa", exported_pod="job-3f9a1c2e-g0001-workers-0-0"}'
        values: '0x20 79x7 stale'
      - series: 'DCGM_FI_DEV_XID_ERRORS{job="annotated-pods", namespace="monitoring", container="dcgm-exporter", cluster="eks-a", node="ip-10-0-1-23", UUID="GPU-aaaa"}'
        values: '_x29 79x30'
    alert_rule_test:
      - eval_time: 7m
        alertname: FailoverXidDcgm
        exp_alerts: []
      - eval_time: 7m30s
        alertname: FailoverXidDcgm
        exp_alerts: []
      - eval_time: 9m
        alertname: FailoverXidDcgm
        exp_alerts: []

  # 3) 79 뒤에 다른 번호(45)가 오면 새 사건으로 울린다. 45를 버리는 것은 분류기다
  - name: 번호가 바뀌면 다시 울린다 (Xid 45도 거르지 않는다)
    interval: 15s
    input_series:
      - series: 'DCGM_FI_DEV_XID_ERRORS{job="annotated-pods", namespace="monitoring", container="dcgm-exporter", cluster="eks-a", node="ip-10-0-1-23", UUID="GPU-aaaa"}'
        values: '0x20 79x19 45x20'
    alert_rule_test:
      - eval_time: 10m15s
        alertname: FailoverXidDcgm
        exp_alerts:
          - exp_labels: {pipeline: failover, signal: xid, source: dcgm, xid: "45", gpu_uuid: GPU-aaaa, cluster: eks-a, node: ip-10-0-1-23, UUID: GPU-aaaa}
            exp_annotations:
              event_ts: '1970-01-01T00:10:15Z'
              summary: 'Xid 45: eks-a ip-10-0-1-23 GPU-aaaa'

  # 3-2) 횟수 경로(GPU-221). 5분에 Xid 79, 10분에 또 79. 번호 지표는 79 그대로라 번호 경로는 둘째를 못 본다.
  #      횟수가 1 → 2로 늘어 두 번 울리고, event_ts는 각자 처음 찍힌 시각. 첫째 때 두 경로가 같이 봐도 알람은 하나
  - name: 같은 Xid가 창 안에서 또 나면 횟수가 늘어 다시 울린다
    interval: 15s
    input_series:
      - series: 'DCGM_FI_DEV_XID_ERRORS{job="annotated-pods", namespace="monitoring", container="dcgm-exporter", cluster="eks-a", node="ip-10-0-1-23", UUID="GPU-aaaa", exported_pod="job-3f9a1c2e-g0001-workers-0-0"}'
        values: '0x19 79x60'
      - series: 'DCGM_EXP_XID_ERRORS_COUNT{job="annotated-pods", namespace="monitoring", container="dcgm-exporter", cluster="eks-a", node="ip-10-0-1-23", UUID="GPU-aaaa", exported_pod="job-3f9a1c2e-g0001-workers-0-0", xid="79"}'
        values: '_x20 1x19 2x40'
      - series: 'DCGM_EXP_XID_ERRORS_COUNT{job="annotated-pods", namespace="monitoring", container="dcgm-exporter", cluster="eks-a", node="ip-10-0-1-23", UUID="GPU-aaaa", exported_pod="job-3f9a1c2e-g0001-workers-0-0"}'
        values: '0x80'
    alert_rule_test:
      - eval_time: 4m45s
        alertname: FailoverXidDcgm
        exp_alerts: []
      - eval_time: 5m
        alertname: FailoverXidDcgm
        exp_alerts: &xid79at5m
          - exp_labels: {pipeline: failover, signal: xid, source: dcgm, xid: "79", gpu_uuid: GPU-aaaa, cluster: eks-a, node: ip-10-0-1-23, UUID: GPU-aaaa}
            exp_annotations:
              event_ts: '1970-01-01T00:05:00Z'
              summary: 'Xid 79: eks-a ip-10-0-1-23 GPU-aaaa'
      - eval_time: 5m45s
        alertname: FailoverXidDcgm
        exp_alerts: *xid79at5m
      - eval_time: 6m
        alertname: FailoverXidDcgm
        exp_alerts: []
      - eval_time: 10m
        alertname: FailoverXidDcgm
        exp_alerts: &xid79at10m
          - exp_labels: {pipeline: failover, signal: xid, source: dcgm, xid: "79", gpu_uuid: GPU-aaaa, cluster: eks-a, node: ip-10-0-1-23, UUID: GPU-aaaa}
            exp_annotations:
              event_ts: '1970-01-01T00:10:00Z'
              summary: 'Xid 79: eks-a ip-10-0-1-23 GPU-aaaa'
      - eval_time: 10m45s
        alertname: FailoverXidDcgm
        exp_alerts: *xid79at10m
      - eval_time: 11m
        alertname: FailoverXidDcgm
        exp_alerts: []

  # 3-3) 첫째가 창(10분)에서 빠진 뒤(15분) 17분에 또 79. 전광판이 비었다가 다시 1 → 다시 울린다
  - name: 창에서 빠진 뒤 같은 Xid가 또 나면 다시 울린다
    interval: 15s
    input_series:
      - series: 'DCGM_FI_DEV_XID_ERRORS{job="annotated-pods", namespace="monitoring", container="dcgm-exporter", cluster="eks-a", node="ip-10-0-1-23", UUID="GPU-aaaa"}'
        values: '0x19 79x80'
      - series: 'DCGM_EXP_XID_ERRORS_COUNT{job="annotated-pods", namespace="monitoring", container="dcgm-exporter", cluster="eks-a", node="ip-10-0-1-23", UUID="GPU-aaaa", xid="79"}'
        values: '_x20 1x39 stale _x7 1x20'
    alert_rule_test:
      - eval_time: 16m45s
        alertname: FailoverXidDcgm
        exp_alerts: []
      - eval_time: 17m
        alertname: FailoverXidDcgm
        exp_alerts: &xid79at17m
          - exp_labels: {pipeline: failover, signal: xid, source: dcgm, xid: "79", gpu_uuid: GPU-aaaa, cluster: eks-a, node: ip-10-0-1-23, UUID: GPU-aaaa}
            exp_annotations:
              event_ts: '1970-01-01T00:17:00Z'
              summary: 'Xid 79: eks-a ip-10-0-1-23 GPU-aaaa'
      - eval_time: 17m45s
        alertname: FailoverXidDcgm
        exp_alerts: *xid79at17m
      - eval_time: 18m
        alertname: FailoverXidDcgm
        exp_alerts: []

  # 3-4) 빈 순간이 수집 한 번(15분)만 기록돼도 잡는다. 대신 1분 전이 그 빈 순간인 16분 한 번만 울린다. event_ts = 다시 찍힌 15분 15초
  #      빈 순간이 수집 사이에 끼어 아예 기록되지 않으면(간격 10분 ~ 10분 15초) 「1, 1」로 이어져 못 본다 — 그 경우는 데이터가 「아무 일 없음」과 같아 테스트로 만들 수 없다
  - name: 빈 순간이 한 번만 기록돼도 다시 울린다
    interval: 15s
    input_series:
      - series: 'DCGM_EXP_XID_ERRORS_COUNT{job="annotated-pods", namespace="monitoring", container="dcgm-exporter", cluster="eks-a", node="ip-10-0-1-23", UUID="GPU-aaaa", xid="79"}'
        values: '_x20 1x39 stale 1x20'
    alert_rule_test:
      - eval_time: 15m45s
        alertname: FailoverXidDcgm
        exp_alerts: []
      - eval_time: 16m
        alertname: FailoverXidDcgm
        exp_alerts:
          - exp_labels: {pipeline: failover, signal: xid, source: dcgm, xid: "79", gpu_uuid: GPU-aaaa, cluster: eks-a, node: ip-10-0-1-23, UUID: GPU-aaaa}
            exp_annotations:
              event_ts: '1970-01-01T00:15:15Z'
              summary: 'Xid 79: eks-a ip-10-0-1-23 GPU-aaaa'
      - eval_time: 16m15s
        alertname: FailoverXidDcgm
        exp_alerts: []

  # 3-5) 학습 Pod가 죽어 exported_pod 라벨이 바뀐다: 같은 수집 회차(7분 30초)에 옛 시계열이 끝나고 새 시계열이 시작된다(11/23 실측) → 다시 안 울린다
  - name: 횟수 지표의 라벨만 바뀌면 다시 울리지 않는다
    interval: 15s
    input_series:
      - series: 'DCGM_EXP_XID_ERRORS_COUNT{job="annotated-pods", namespace="monitoring", container="dcgm-exporter", cluster="eks-a", node="ip-10-0-1-23", UUID="GPU-aaaa", exported_pod="job-3f9a1c2e-g0001-workers-0-0", xid="79"}'
        values: '_x20 1x9 stale'
      - series: 'DCGM_EXP_XID_ERRORS_COUNT{job="annotated-pods", namespace="monitoring", container="dcgm-exporter", cluster="eks-a", node="ip-10-0-1-23", UUID="GPU-aaaa", xid="79"}'
        values: '_x30 1x30'
    alert_rule_test:
      - eval_time: 5m
        alertname: FailoverXidDcgm
        exp_alerts:
          - exp_labels: {pipeline: failover, signal: xid, source: dcgm, xid: "79", gpu_uuid: GPU-aaaa, cluster: eks-a, node: ip-10-0-1-23, UUID: GPU-aaaa}
            exp_annotations:
              event_ts: '1970-01-01T00:05:00Z'
              summary: 'Xid 79: eks-a ip-10-0-1-23 GPU-aaaa'
      - eval_time: 7m30s
        alertname: FailoverXidDcgm
        exp_alerts: []
      - eval_time: 8m
        alertname: FailoverXidDcgm
        exp_alerts: []
      - eval_time: 8m30s
        alertname: FailoverXidDcgm
        exp_alerts: []

  # 3-1) 학습 Pod가 같은 이름의 지표를 내도(출처 라벨이 다르다) 울리지 않는다
  - name: dcgm-exporter가 아닌 곳에서 온 Xid 지표는 보지 않는다
    interval: 15s
    input_series:
      - series: 'DCGM_FI_DEV_XID_ERRORS{job="annotated-pods", namespace="training", container="trainer", cluster="eks-a", node="ip-10-0-1-23", exported_UUID="GPU-aaaa"}'
        values: '0x20 79x40'
      - series: 'DCGM_EXP_XID_ERRORS_COUNT{job="annotated-pods", namespace="training", container="trainer", cluster="eks-a", node="ip-10-0-1-23", UUID="GPU-aaaa", xid="79"}'
        values: '_x20 1x40'
      - series: 'kube_pod_container_status_terminated_reason{job="annotated-pods", cluster="eks-a", namespace="training", pod="p", exported_container="trainer", container="trainer", reason="Error"}'
        values: '_x21 1x40'
      - series: 'kube_pod_completion_time{job="annotated-pods", cluster="eks-a", namespace="training", pod="p"}'
        values: '_x21 305x40'
      - series: 'kube_pod_info{job="annotated-pods", cluster="eks-a", namespace="training", pod="p", node="n"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 5m30s
        alertname: FailoverXidDcgm
        exp_alerts: []
      - eval_time: 5m30s
        alertname: FailoverPodExit
        exp_alerts: []

  # 4) rank 0의 trainer가 5분 5초에 Error로 끝났다(지표에는 5분 15초부터 보인다). 90초 동안만 울리고 event_ts = 종료 시각
  #    rank 1은 정상 완료, rank 2는 사이드카만 끝남, 다른 네임스페이스 Pod는 대상이 아니다
  - name: trainer가 비정상 종료하면 종료 시각으로 울린다
    interval: 15s
    input_series:
      - series: 'kube_pod_container_status_terminated_reason{job="kube-state-metrics", cluster="eks-a", namespace="training", pod="job-3f9a1c2e-g0001-workers-0-0", container="trainer", reason="Error"}'
        values: '_x21 1x40'
      - series: 'kube_pod_completion_time{job="kube-state-metrics", cluster="eks-a", namespace="training", pod="job-3f9a1c2e-g0001-workers-0-0"}'
        values: '_x21 305x40'
      - series: 'kube_pod_info{job="kube-state-metrics", cluster="eks-a", namespace="training", pod="job-3f9a1c2e-g0001-workers-0-0", node="ip-10-0-1-23"}'
        values: '1x60'
      - series: 'kube_pod_container_status_terminated_reason{job="kube-state-metrics", cluster="eks-a", namespace="training", pod="job-3f9a1c2e-g0001-workers-0-1", container="trainer", reason="Completed"}'
        values: '_x21 1x40'
      - series: 'kube_pod_completion_time{job="kube-state-metrics", cluster="eks-a", namespace="training", pod="job-3f9a1c2e-g0001-workers-0-1"}'
        values: '_x21 305x40'
      - series: 'kube_pod_info{job="kube-state-metrics", cluster="eks-a", namespace="training", pod="job-3f9a1c2e-g0001-workers-0-1", node="ip-10-0-1-24"}'
        values: '1x60'
      - series: 'kube_pod_container_status_terminated_reason{job="kube-state-metrics", cluster="eks-a", namespace="training", pod="job-3f9a1c2e-g0001-workers-0-2", container="ckpt-sidecar", reason="Error"}'
        values: '_x21 1x40'
      - series: 'kube_pod_completion_time{job="kube-state-metrics", cluster="eks-a", namespace="training", pod="job-3f9a1c2e-g0001-workers-0-2"}'
        values: '_x21 305x40'
      - series: 'kube_pod_info{job="kube-state-metrics", cluster="eks-a", namespace="training", pod="job-3f9a1c2e-g0001-workers-0-2", node="ip-10-0-1-25"}'
        values: '1x60'
      - series: 'kube_pod_container_status_terminated_reason{job="kube-state-metrics", cluster="eks-a", namespace="platform", pod="other", container="trainer", reason="Error"}'
        values: '_x21 1x40'
      - series: 'kube_pod_completion_time{job="kube-state-metrics", cluster="eks-a", namespace="platform", pod="other"}'
        values: '_x21 305x40'
      - series: 'kube_pod_info{job="kube-state-metrics", cluster="eks-a", namespace="platform", pod="other", node="ip-10-0-1-26"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 5m
        alertname: FailoverPodExit
        exp_alerts: []
      - eval_time: 5m15s
        alertname: FailoverPodExit
        exp_alerts: &exit
          - exp_labels: {pipeline: failover, signal: pod_exit, cluster: eks-a, namespace: training, pod: job-3f9a1c2e-g0001-workers-0-0, node: ip-10-0-1-23, reason: Error}
            exp_annotations:
              event_ts: '1970-01-01T00:05:05Z'
              log_line: 'trainer terminated: Error'
              summary: '학습 Pod 종료(Error): eks-a job-3f9a1c2e-g0001-workers-0-0'
      - eval_time: 6m30s
        alertname: FailoverPodExit
        exp_alerts: *exit
      - eval_time: 6m45s
        alertname: FailoverPodExit
        exp_alerts: []

  # 5) OOM으로 죽으면 사유가 OOMKilled로 간다
  - name: OOMKilled는 사유로 구분된다
    interval: 15s
    input_series:
      - series: 'kube_pod_container_status_terminated_reason{job="kube-state-metrics", cluster="eks-b", namespace="training", pod="job-7c1d-g0002-workers-0-3", container="trainer", reason="OOMKilled"}'
        values: '_x21 1x40'
      - series: 'kube_pod_completion_time{job="kube-state-metrics", cluster="eks-b", namespace="training", pod="job-7c1d-g0002-workers-0-3"}'
        values: '_x21 305x40'
      - series: 'kube_pod_info{job="kube-state-metrics", cluster="eks-b", namespace="training", pod="job-7c1d-g0002-workers-0-3", node="ip-10-1-1-9"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 5m30s
        alertname: FailoverPodExit
        exp_alerts:
          - exp_labels: {pipeline: failover, signal: pod_exit, cluster: eks-b, namespace: training, pod: job-7c1d-g0002-workers-0-3, node: ip-10-1-1-9, reason: OOMKilled}
            exp_annotations:
              event_ts: '1970-01-01T00:05:05Z'
              log_line: 'trainer terminated: OOMKilled'
              summary: '학습 Pod 종료(OOMKilled): eks-b job-7c1d-g0002-workers-0-3'

  # 6) eks-a의 Agent 지표가 5분까지만 온다. 2분 뒤부터 울리고 event_ts = 마지막 샘플 시각, 10분이 지나면 꺼진다
  #    eks-b는 계속 오고, onprem-manager는 끊겨도 대상이 아니다
  - name: EKS 클러스터 수집이 2분 끊기면 울린다
    interval: 15s
    input_series:
      - series: 'up{job="prometheus-agent", cluster="eks-a", instance="localhost:9090"}'
        values: '1x20'
      - series: 'up{job="prometheus-agent", cluster="eks-b", instance="localhost:9090"}'
        values: '1x80'
      - series: 'up{job="prometheus-agent", cluster="onprem-manager", instance="localhost:9090"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 6m45s
        alertname: FailoverSiteDown
        exp_alerts: []
      - eval_time: 7m15s
        alertname: FailoverSiteDown
        exp_alerts: &site
          - exp_labels: {pipeline: failover, signal: site, cluster: eks-a}
            exp_annotations:
              event_ts: '1970-01-01T00:05:00Z'
              summary: '클러스터 수집 끊김: eks-a'
      - eval_time: 14m45s
        alertname: FailoverSiteDown
        exp_alerts: *site
      - eval_time: 15m15s
        alertname: FailoverSiteDown
        exp_alerts: []

  # 7) eks-a · eks-b 둘 다 5분에 끊긴다. eks-b는 OFF 절차로 펜싱돼 있어(fenced="true") 빠지고 eks-a만 울린다.
  #    펜싱 지표는 관리 클러스터 KSM이 내므로 cluster="onprem-manager"다(name이 EKS 이름)
  - name: 펜싱된 EKS는 수집이 끊겨도 울리지 않는다
    interval: 15s
    input_series:
      - series: 'up{job="prometheus-agent", cluster="eks-a", instance="localhost:9090"}'
        values: '1x20'
      - series: 'up{job="prometheus-agent", cluster="eks-b", instance="localhost:9090"}'
        values: '1x20'
      - series: 'kube_customresource_multikueuecluster_info{job="kube-state-metrics", cluster="onprem-manager", customresource_kind="MultiKueueCluster", name="eks-a"}'
        values: '1x80'
      - series: 'kube_customresource_multikueuecluster_info{job="kube-state-metrics", cluster="onprem-manager", customresource_kind="MultiKueueCluster", name="eks-b", fenced="true"}'
        values: '1x80'
    alert_rule_test:
      - eval_time: 7m15s
        alertname: FailoverSiteDown
        exp_alerts: *site

  # 8) 대상(eks-a · b · c) 밖의 이름은 끊겨도 울리지 않는다
  - name: eks-a · b · c가 아닌 클러스터는 대상이 아니다
    interval: 15s
    input_series:
      - series: 'up{job="prometheus-agent", cluster="eks-test", instance="localhost:9090"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 7m15s
        alertname: FailoverSiteDown
        exp_alerts: []

  # 9) 11/24 15:30 재현: 온프레 인터넷(1.1.1.1)이 5분~5분 30초에 끊기고 같은 때 eks-a · b 수집도 끊긴다.
  #    알람이 울릴 수 있는 기간(7분 15초 ~ 14분 45초) 내내 울리지 않는다
  - name: 온프레 인터넷이 끊겼던 동안에는 사이트 알람이 울리지 않는다
    interval: 15s
    input_series:
      - series: 'up{job="prometheus-agent", cluster="eks-a", instance="localhost:9090"}'
        values: '1x20'
      - series: 'up{job="prometheus-agent", cluster="eks-b", instance="localhost:9090"}'
        values: '1x20'
      - series: 'probe_success{job="blackbox-icmp", target_name="internet", instance="1.1.1.1"}'
        values: '1x19 0 0 0 1x80'
    alert_rule_test:
      - eval_time: 7m15s
        alertname: FailoverSiteDown
        exp_alerts: []
      - eval_time: 14m45s
        alertname: FailoverSiteDown
        exp_alerts: []

  # 10) 인터넷 실패가 10분보다 오래전(1분 ~ 1분 30초)이면 거르지 않는다. eks-a는 15분에 끊겨 17분 15초에 울린다
  - name: 10분보다 오래된 인터넷 실패는 사이트 알람을 막지 않는다
    interval: 15s
    input_series:
      - series: 'up{job="prometheus-agent", cluster="eks-a", instance="localhost:9090"}'
        values: '1x60'
      - series: 'probe_success{job="blackbox-icmp", target_name="internet", instance="1.1.1.1"}'
        values: '1x3 0 0 0 1x120'
    alert_rule_test:
      - eval_time: 17m15s
        alertname: FailoverSiteDown
        exp_alerts:
          - exp_labels: {pipeline: failover, signal: site, cluster: eks-a}
            exp_annotations:
              event_ts: '1970-01-01T00:15:00Z'
              summary: '클러스터 수집 끊김: eks-a'

  # --- FailoverGpuNodeLost. g1 = GPU 노드, c1 = CPU 노드. KSM은 계속 긁힌다(따로 적은 경우 제외) ---
  # 11) GPU 노드 g1이 5분에 지워진다(KSM이 지표를 더 안 냄 → Agent가 stale 표시). 1분 뒤 울리고 event_ts = 마지막 Ready 샘플,
  #     최근 10분 안에 Ready였던 동안(15분 전까지)만 울린다
  - name: GPU 노드가 지워지면 1분 뒤 울리고 10분 뒤 꺼진다
    interval: 15s
    input_series:
      - series: 'kube_node_status_condition{job="kube-state-metrics", cluster="eks-a", node="g1", condition="Ready", status="true"}'
        values: '1x20 stale'
      - series: 'kube_node_status_allocatable{job="kube-state-metrics", cluster="eks-a", node="g1", resource="nvidia_com_gpu"}'
        values: '1x20 stale'
      - series: 'up{job="kube-state-metrics", cluster="eks-a", instance="ksm:8080"}'
        values: '1x80'
    alert_rule_test:
      - eval_time: 6m
        alertname: FailoverGpuNodeLost
        exp_alerts: []
      - eval_time: 6m15s
        alertname: FailoverGpuNodeLost
        exp_alerts: &nodelost
          - exp_labels: {pipeline: failover, signal: node_lost, cluster: eks-a, node: g1}
            exp_annotations:
              event_ts: '1970-01-01T00:05:00Z'
              log_line: 'GPU node not Ready or deleted'
              summary: 'GPU 노드 소실: eks-a g1'
      - eval_time: 14m45s
        alertname: FailoverGpuNodeLost
        exp_alerts: *nodelost
      - eval_time: 15m15s
        alertname: FailoverGpuNodeLost
        exp_alerts: []

  # 12) g1이 5분 15초부터 NotReady로 계속 남는다(Node가 안 지워짐). 같은 시각에 울리고 10분 뒤 꺼진다
  - name: NotReady가 이어져도 10분 뒤에는 꺼진다
    interval: 15s
    input_series:
      - series: 'kube_node_status_condition{job="kube-state-metrics", cluster="eks-a", node="g1", condition="Ready", status="true"}'
        values: '1x20 0x80'
      - series: 'kube_node_status_allocatable{job="kube-state-metrics", cluster="eks-a", node="g1", resource="nvidia_com_gpu"}'
        values: '1x100'
      - series: 'up{job="kube-state-metrics", cluster="eks-a", instance="ksm:8080"}'
        values: '1x100'
    alert_rule_test:
      - eval_time: 6m15s
        alertname: FailoverGpuNodeLost
        exp_alerts: *nodelost
      - eval_time: 14m45s
        alertname: FailoverGpuNodeLost
        exp_alerts: *nodelost
      - eval_time: 15m15s
        alertname: FailoverGpuNodeLost
        exp_alerts: []

  # 13) 45초만 NotReady였다가 돌아온다. 1분이 안 돼 울리지 않는다
  - name: 1분 안에 돌아온 노드는 울리지 않는다
    interval: 15s
    input_series:
      - series: 'kube_node_status_condition{job="kube-state-metrics", cluster="eks-a", node="g1", condition="Ready", status="true"}'
        values: '1x20 0 0 0 1x60'
      - series: 'kube_node_status_allocatable{job="kube-state-metrics", cluster="eks-a", node="g1", resource="nvidia_com_gpu"}'
        values: '1x80'
      - series: 'up{job="kube-state-metrics", cluster="eks-a", instance="ksm:8080"}'
        values: '1x80'
    alert_rule_test:
      - eval_time: 5m45s
        alertname: FailoverGpuNodeLost
        exp_alerts: []
      - eval_time: 6m15s
        alertname: FailoverGpuNodeLost
        exp_alerts: []

  # 14) KSM이 5분에 죽는다(up 0). 노드 지표가 한꺼번에 사라져도 노드가 죽은 것으로 보지 않는다
  - name: KSM이 죽어 노드 지표가 사라진 것은 울리지 않는다
    interval: 15s
    input_series:
      - series: 'kube_node_status_condition{job="kube-state-metrics", cluster="eks-a", node="g1", condition="Ready", status="true"}'
        values: '1x20 stale'
      - series: 'kube_node_status_allocatable{job="kube-state-metrics", cluster="eks-a", node="g1", resource="nvidia_com_gpu"}'
        values: '1x20 stale'
      - series: 'up{job="kube-state-metrics", cluster="eks-a", instance="ksm:8080"}'
        values: '1x20 0x60'
    alert_rule_test:
      - eval_time: 6m15s
        alertname: FailoverGpuNodeLost
        exp_alerts: []
      - eval_time: 10m
        alertname: FailoverGpuNodeLost
        exp_alerts: []

  # 15) EKS OFF 절차: 펜싱(fenced="true") 뒤 GPU 노드가 사라진다. 울리지 않는다
  - name: 펜싱된 EKS의 노드가 사라지면 울리지 않는다
    interval: 15s
    input_series:
      - series: 'kube_node_status_condition{job="kube-state-metrics", cluster="eks-a", node="g1", condition="Ready", status="true"}'
        values: '1x20 stale'
      - series: 'kube_node_status_allocatable{job="kube-state-metrics", cluster="eks-a", node="g1", resource="nvidia_com_gpu"}'
        values: '1x20 stale'
      - series: 'up{job="kube-state-metrics", cluster="eks-a", instance="ksm:8080"}'
        values: '1x80'
      - series: 'kube_customresource_multikueuecluster_info{job="kube-state-metrics", cluster="onprem-manager", customresource_kind="MultiKueueCluster", name="eks-a", fenced="true"}'
        values: '1x80'
    alert_rule_test:
      - eval_time: 6m15s
        alertname: FailoverGpuNodeLost
        exp_alerts: []

  # 16) GPU가 없는 노드(c1, CPU allocatable만 있음)가 지워지는 것은 대상이 아니다
  - name: CPU 노드가 사라지는 것은 울리지 않는다
    interval: 15s
    input_series:
      - series: 'kube_node_status_condition{job="kube-state-metrics", cluster="eks-a", node="c1", condition="Ready", status="true"}'
        values: '1x20 stale'
      - series: 'kube_node_status_allocatable{job="kube-state-metrics", cluster="eks-a", node="c1", resource="cpu"}'
        values: '2x20 stale'
      - series: 'up{job="kube-state-metrics", cluster="eks-a", instance="ksm:8080"}'
        values: '1x80'
    alert_rule_test:
      - eval_time: 6m15s
        alertname: FailoverGpuNodeLost
        exp_alerts: []

  # 17) 대상(eks-a · b · c) 밖의 클러스터는 GPU 노드가 사라져도 울리지 않는다(kind 검증 클러스터 kind-test 등)
  - name: eks-a · b · c가 아닌 클러스터의 GPU 노드는 대상이 아니다
    interval: 15s
    input_series:
      - series: 'kube_node_status_condition{job="kube-state-metrics", cluster="kind-test", node="g1", condition="Ready", status="true"}'
        values: '1x20 stale'
      - series: 'kube_node_status_allocatable{job="kube-state-metrics", cluster="kind-test", node="g1", resource="nvidia_com_gpu"}'
        values: '1x20 stale'
      - series: 'up{job="kube-state-metrics", cluster="kind-test", instance="ksm:8080"}'
        values: '1x80'
    alert_rule_test:
      - eval_time: 6m15s
        alertname: FailoverGpuNodeLost
        exp_alerts: []

  # 18) 작업 3f9a1c2e 세대 1의 JobSet이 5분 5초에 Failed가 됐다(지표에는 5분 15초부터). 죽은 Pod는 바로 지워져 종료 사유 지표가 없다
  #     실패 시각부터 3분 동안만 울리고 event_ts = 실패 시각, cluster = 그 작업 Pod가 있던 EKS
  - name: JobSet이 실패하면 Pod가 지워졌어도 실패 시각으로 울린다
    interval: 15s
    input_series:
      - series: 'kube_customresource_jobset_failed_time{job="kube-state-metrics", cluster="onprem-manager", namespace="training", name="job-3f9a1c2e-g0001", job_id="3f9a1c2e", generation="1"}'
        values: '_x21 305x60'
      - series: 'kube_pod_labels{job="kube-state-metrics", cluster="eks-a", namespace="training", pod="job-3f9a1c2e-g0001-workers-0-0", label_devoops_job_id="3f9a1c2e", label_devoops_generation="1"}'
        values: '1x20 stale'
      - series: 'kube_pod_labels{job="kube-state-metrics", cluster="eks-a", namespace="training", pod="job-3f9a1c2e-g0001-workers-0-1", label_devoops_job_id="3f9a1c2e", label_devoops_generation="1"}'
        values: '1x20 stale'
    alert_rule_test:
      - eval_time: 5m
        alertname: FailoverJobFailed
        exp_alerts: []
      - eval_time: 5m15s
        alertname: FailoverJobFailed
        exp_alerts: &jobfailed
          - exp_labels: {pipeline: failover, signal: job_failed, cluster: eks-a, job_id: 3f9a1c2e, generation: "1"}
            exp_annotations:
              event_ts: '1970-01-01T00:05:05Z'
              log_line: 'jobset failed: job-3f9a1c2e generation 1'
              summary: '학습 작업 실패: eks-a 3f9a1c2e 세대 1'
      - eval_time: 8m
        alertname: FailoverJobFailed
        exp_alerts: *jobfailed
      - eval_time: 8m15s
        alertname: FailoverJobFailed
        exp_alerts: []

  # 19) 울리지 않는 경우: 오래전에 실패해 남아 있는 JobSet(old), EKS에 Pod가 뜬 적 없는 작업(nopod),
  #     대상 밖 클러스터(kind-test)에서 돌던 작업(kind), 실패하지 않은 작업(지표 없음)
  - name: 오래된 실패 · Pod가 없던 작업 · 대상 밖 클러스터는 울리지 않는다
    interval: 15s
    input_series:
      - series: 'kube_customresource_jobset_failed_time{job="kube-state-metrics", cluster="onprem-manager", namespace="training", name="job-0000000a-g0001", job_id="0000000a", generation="1"}'
        values: '10x60'
      - series: 'kube_pod_labels{job="kube-state-metrics", cluster="eks-a", namespace="training", pod="job-0000000a-g0001-workers-0-0", label_devoops_job_id="0000000a", label_devoops_generation="1"}'
        values: '1x60'
      - series: 'kube_customresource_jobset_failed_time{job="kube-state-metrics", cluster="onprem-manager", namespace="training", name="job-0000000b-g0001", job_id="0000000b", generation="1"}'
        values: '_x21 305x60'
      - series: 'kube_customresource_jobset_failed_time{job="kube-state-metrics", cluster="onprem-manager", namespace="training", name="job-0000000c-g0001", job_id="0000000c", generation="1"}'
        values: '_x21 305x60'
      - series: 'kube_pod_labels{job="kube-state-metrics", cluster="kind-test", namespace="training", pod="job-0000000c-g0001-workers-0-0", label_devoops_job_id="0000000c", label_devoops_generation="1"}'
        values: '1x60'
      - series: 'kube_pod_labels{job="kube-state-metrics", cluster="eks-b", namespace="training", pod="job-0000000d-g0001-workers-0-0", label_devoops_job_id="0000000d", label_devoops_generation="1"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 4m
        alertname: FailoverJobFailed
        exp_alerts: []
      - eval_time: 5m30s
        alertname: FailoverJobFailed
        exp_alerts: []

  # 20) 복구로 세대 2가 떴다가 그것도 실패하면 세대마다 따로 울린다(세대 1의 옛 실패는 창 밖)
  - name: 다음 세대가 실패하면 그 세대로 다시 울린다
    interval: 15s
    input_series:
      - series: 'kube_customresource_jobset_failed_time{job="kube-state-metrics", cluster="onprem-manager", namespace="training", name="job-3f9a1c2e-g0001", job_id="3f9a1c2e", generation="1"}'
        values: '10x60'
      - series: 'kube_customresource_jobset_failed_time{job="kube-state-metrics", cluster="onprem-manager", namespace="training", name="job-3f9a1c2e-g0002", job_id="3f9a1c2e", generation="2"}'
        values: '_x21 305x60'
      - series: 'kube_pod_labels{job="kube-state-metrics", cluster="eks-b", namespace="training", pod="job-3f9a1c2e-g0002-workers-0-0", label_devoops_job_id="3f9a1c2e", label_devoops_generation="2"}'
        values: '1x20 stale'
    alert_rule_test:
      - eval_time: 5m15s
        alertname: FailoverJobFailed
        exp_alerts:
          - exp_labels: {pipeline: failover, signal: job_failed, cluster: eks-b, job_id: 3f9a1c2e, generation: "2"}
            exp_annotations:
              event_ts: '1970-01-01T00:05:05Z'
              log_line: 'jobset failed: job-3f9a1c2e generation 2'
              summary: '학습 작업 실패: eks-b 3f9a1c2e 세대 2'

