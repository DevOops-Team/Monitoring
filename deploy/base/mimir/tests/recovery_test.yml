# promtool test rules. scripts/deploy-k8s.sh의 lint 단계가 돌린다
rule_files:
  - ../rules/recovery.yml
evaluation_interval: 15s

tests:
  # 1) 첫 HOLD: 시계열이 1분 45초에 값 1로 태어난다(_x7 = 빈 샘플 7개) → increase()는 0이지만 울려야 한다. 5분 뒤엔 꺼진다
  - name: 새 시계열의 첫 HOLD를 잡는다
    interval: 15s
    input_series:
      - series: 'recovery_hold_total{cluster="onprem-manager", instance="10.0.0.1:8080", job_id="job-a", reason="stage_timeout"}'
        values: '_x7 1x60'
    alert_rule_test:
      - eval_time: 1m30s
        alertname: RecoveryHold
        exp_alerts: []
      - eval_time: 2m30s
        alertname: RecoveryHold
        exp_alerts:
          - exp_labels: {severity: critical, cluster: onprem-manager, job_id: job-a, reason: stage_timeout}
            exp_annotations:
              summary: '자동 복구 보류(HOLD): job job-a · 사유 stage_timeout — 사람 확인 필요'
      - eval_time: 8m
        alertname: RecoveryHold
        exp_alerts: []

  # 2) 같은 job·reason의 두 번째 HOLD: 20분에 1 → 2
  - name: 기존 시계열 증가를 잡는다
    interval: 15s
    input_series:
      - series: 'recovery_hold_total{cluster="onprem-manager", instance="10.0.0.1:8080", job_id="job-a", reason="stage_timeout"}'
        values: '1x79 2x60'
    alert_rule_test:
      - eval_time: 19m
        alertname: RecoveryHold
        exp_alerts: []
      - eval_time: 21m
        alertname: RecoveryHold
        exp_alerts:
          - exp_labels: {severity: critical, cluster: onprem-manager, job_id: job-a, reason: stage_timeout}
            exp_annotations:
              summary: '자동 복구 보류(HOLD): job job-a · 사유 stage_timeout — 사람 확인 필요'

  # 3) 수집이 10분 끊겼다 돌아옴(값 그대로): 옛 HOLD를 다시 울리면 안 된다
  - name: 수집 공백 뒤 옛 HOLD를 다시 울리지 않는다
    interval: 15s
    input_series:
      - series: 'recovery_hold_total{cluster="onprem-manager", instance="10.0.0.1:8080", job_id="job-a", reason="stage_timeout"}'
        values: '1x40 _x40 1x40'
    alert_rule_test:
      - eval_time: 21m
        alertname: RecoveryHold
        exp_alerts: []
      - eval_time: 24m
        alertname: RecoveryHold
        exp_alerts: []

  # 4) 컨트롤러 재시작: 옛 Pod 시계열이 끊기고, 새 Pod(다른 instance)에서 같은 job·reason이 1로 태어남 → 새 HOLD
  - name: 컨트롤러 재시작 뒤 같은 job·reason의 HOLD를 잡는다
    interval: 15s
    input_series:
      - series: 'recovery_hold_total{cluster="onprem-manager", instance="10.0.0.1:8080", job_id="job-a", reason="stage_timeout"}'
        values: '1x40 stale'
      - series: 'recovery_hold_total{cluster="onprem-manager", instance="10.0.0.2:8080", job_id="job-a", reason="stage_timeout"}'
        values: '_x59 1x40'
    alert_rule_test:
      - eval_time: 14m
        alertname: RecoveryHold
        exp_alerts: []
      - eval_time: 15m30s
        alertname: RecoveryHold
        exp_alerts:
          - exp_labels: {severity: critical, cluster: onprem-manager, job_id: job-a, reason: stage_timeout}
            exp_annotations:
              summary: '자동 복구 보류(HOLD): job job-a · 사유 stage_timeout — 사람 확인 필요'

  # 5) 전역 Watchdog HOLD: job_id가 빈 값
  - name: job_id가 빈 전역 HOLD
    interval: 15s
    input_series:
      - series: 'recovery_hold_total{cluster="onprem-manager", instance="10.0.0.1:8080", job_id="", reason="watchdog_missing_and_no_gpu_fault"}'
        values: '_x7 1x60'
    alert_rule_test:
      - eval_time: 2m30s
        alertname: RecoveryHold
        exp_alerts:
          - exp_labels: {severity: critical, cluster: onprem-manager, reason: watchdog_missing_and_no_gpu_fault}
            exp_annotations:
              summary: '자동 복구 보류(HOLD): 전역(Watchdog) · 사유 watchdog_missing_and_no_gpu_fault — 사람 확인 필요'
