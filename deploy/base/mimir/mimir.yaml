# Mimir 모놀리식(-target=all) 3개, 노드마다 하나. 블록은 S3(접두어 mimir/), PVC에는 WAL · 최근 2시간 head · 캐시만 남는다.
# 샘플은 3개 모두에 쓰고 2개가 받으면 성공 → 하나가 죽어도 쓰기 · 조회 · 룰 평가가 계속된다 (docs/monitoring-ha.md 3.2)
multitenancy_enabled: false          # 테넌트 하나(anonymous). 룰 디렉터리 이름이 여기서 온다
target: all

server:
  http_listen_port: 9009             # remote_write · 조회 · ruler API. 밖에서는 서비스 VIP 172.30.0.35:9009
  grpc_listen_port: 9095
  log_level: info

common:
  storage:
    backend: filesystem
    filesystem:
      dir: /data/common

blocks_storage:
  backend: s3
  s3:
    endpoint: s3.us-east-2.amazonaws.com
    region: us-east-2                # 비우면 GetBucketLocation을 부르는데 역할에 그 권한이 없다
    bucket_name: devoops-prod-monitoring-947027666399-us-east-2
    # 키를 설정에 두지 않는다. AWS SDK 기본 순서로 찾고, 실제로는 같은 Pod의 aws-credentials 사이드카
    # (IAM Roles Anywhere, statefulset.yaml)가 127.0.0.1:9911에서 EC2 메타데이터 흉내로 1시간짜리 키를 준다
    native_aws_auth_enabled: true
  storage_prefix: mimir              # 버킷을 Loki · Tempo와 같이 쓴다. 역할은 mimir/* 만 허용
  tsdb:
    dir: /data/tsdb
  bucket_store:
    sync_dir: /data/tsdb-sync

compactor:
  data_dir: /data/compactor
  sharding_ring:
    kvstore:
      store: memberlist

distributor:
  ring:
    kvstore:
      store: memberlist
  # 같은 대상을 긁는 Agent 2개(묶음) 중 한쪽 샘플만 받는다. 뽑힌 쪽이 30초 동안 안 보내면 다른 쪽으로 넘어간다.
  # 묶음 라벨이 없는 샘플(EKS Agent)은 그대로 통과한다 (docs/monitoring-ha.md 3.4)
  ha_tracker:
    enable_ha_tracker: true
    kvstore:
      store: memberlist

ingester:
  ring:
    kvstore:
      store: memberlist
    replication_factor: 3

store_gateway:
  sharding_ring:
    replication_factor: 3

memberlist:
  join_members:
    - mimir-headless.monitoring.svc.cluster.local:7946

# 룰은 ConfigMap(mimir-rules)을 /etc/mimir/rules/anonymous/ 에 마운트해 읽는다. 1분마다 다시 읽음
ruler:
  rule_path: /data/ruler
  evaluation_interval: 15s           # compose Prometheus와 같은 평가 주기(fault-event ±45s 창의 전제)
  poll_interval: 1m
ruler_storage:
  backend: local
  local:
    directory: /etc/mimir/rules

limits:
  compactor_blocks_retention_period: 30d   # compose --storage.tsdb.retention.time=30d 와 동일
  # 수신 한도. 넘은 요청은 429로 거절되고 Prometheus는 429를 다시 보내지 않아 그 샘플은 사라진다.
  # 기본값(10000/s · burst 200000 · 시계열 150000)은 11/16 실측(평소 6200/s, 시계열 10만)에 여유가 없었다:
  # Mimir 재시작 뒤 Agent가 밀린 것을 한꺼번에 보내자 1분 동안 8.8만 샘플이 거절됐다. EKS Agent가 붙기 전에 올린다
  ingestion_rate: 50000                    # 초당 샘플
  ingestion_burst_size: 1000000            # 재시작 · 단절 복구 직후 몰리는 양
  # 메모리 안 시계열 수. 11/23 실측 Pod당 14만(EKS가 켜지면 약 24만). 라벨을 바꾸면 옛 시계열과 새 시계열이
  # 2~3시간 같이 남아 두 배가 되므로 그 여유까지 잡았다. 더 올리려면 Pod 메모리(3Gi)도 같이 본다
  max_global_series_per_user: 600000
  # 룰을 「지금」이 아니라 이만큼 전 시점 기준으로 평가한다(늦게 도착한 샘플을 빠뜨리지 않으려는 여유).
  # 기본값 1분은 11/23 주입 ①에서 감지 89초 중 60초를 차지했다. 실측 전송 지연은 평소 0~1초,
  # Mimir 재시작 중 최대 7초라 수집 주기 한 번(15초)으로 줄인다. 모든 룰(알람 · 레코딩)에 적용된다
  ruler_evaluation_delay_duration: 15s
  # Agent 묶음 구분. agent_group = 어느 묶음인지, __replica__ = 묶음 안의 어느 Agent인지(저장할 때 지워진다)
  accept_ha_samples: true
  ha_cluster_label: agent_group
  ha_replica_label: __replica__
  # 알람은 Service 하나가 아니라 Alertmanager Pod 전부에게 보낸다(AM끼리는 알림 기록만 나누고 알람은 나누지 않는다).
  # headless Service의 SRV 레코드로 Pod 목록을 찾는다. ruler.alertmanager_url은 3.2.4에서 폐기 예정이라 여기로 옮겼다 (docs/monitoring-ha.md 3.1)
  ruler_alertmanager_client_config:
    alertmanager_url: dnssrvnoa+http://_http._tcp.alertmanager-headless.monitoring.svc.cluster.local.

# 진행 중인 쿼리 기록 파일. 기본값은 작업 디렉터리라 비루트 계정이 못 쓴다 → PVC로
activity_tracker:
  filepath: /data/metrics-activity.log

usage_stats:
  enabled: false
