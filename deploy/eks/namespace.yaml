# EKS monitoring 네임스페이스는 IaC Terraform(eks-hub-registration)도 만든다: Argo CD보다 먼저 ghcr-pull Secret을 넣어야 해서(GPU-92).
# 둘이 같이 관리한다(training과 같은 방식). Terraform은 라벨 · 어노테이션을 건드리지 않는다.
# Prune=false: 앱이 지워지거나 prune될 때 네임스페이스를 지우면 Terraform이 넣은 Secret까지 사라진다
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
