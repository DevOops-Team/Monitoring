# 이 클러스터의 이름. Agent · OTel 게이트웨이가 여기서 CLUSTER_NAME을 읽어 지표의 cluster 라벨 · 로그의 k8s_cluster_name으로 쓴다.
# 값은 파일에 적지 않는다: Gitops ApplicationSet gpu-eks-monitoring이 클러스터마다 Argo CD 클러스터 이름(eks-a · eks-b · eks-c)으로 바꿔 넣는다
# (스케줄링 쪽 training/devoops-cluster-info와 같은 방식). 손으로 올릴 때는 deploy/README.md 「EKS 수집 층」의 명령이 바꿔 넣는다.
# "unset"인 채로 뜨면 cluster="unset"으로 들어가므로 바로 눈에 띈다
apiVersion: v1
kind: ConfigMap
metadata:
  name: monitoring-cluster-info
data:
  CLUSTER_NAME: unset
  SITE: aws
