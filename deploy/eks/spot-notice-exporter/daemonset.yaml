# GPU 노드(전부 스팟)마다 하나. 그 노드의 IMDS에서 스팟 회수 예고(2분 전)를 읽어 Pod IP:9105로 연다 (GPU-219).
# 왜 따로 만드나: EKS 관리형 노드그룹은 예고가 오면 노드를 비우기만 하고 쿠버네티스에 「스팟 회수」라는 표시를 남기지 않는다.
#   Node Termination Handler는 스스로 cordon · drain을 해서 relocator와 겹친다 → 읽기만 하는 스크립트(exporter.py, ConfigMap)
# IMDS는 Pod 네트워크에서 읽는다: GPU 런치 템플릿이 hop limit 2 · IMDSv2 필수(IaC terraform/modules/eks/nodes-gpu.tf)
# Service 없음: Agent의 annotated-pods 잡이 어노테이션을 보고 Pod를 직접 긁는다(dcgm-exporter와 같음)
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: spot-notice-exporter
  labels:
    app.kubernetes.io/name: spot-notice-exporter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: spot-notice-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spot-notice-exporter
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9105"
    spec:
      automountServiceAccountToken: false
      priorityClassName: system-node-critical
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      nodeSelector:
        devoops/gpu: "true"
      tolerations:
        - operator: Exists          # GPU taint · 예비 · 고장 어떤 taint든 GPU 노드 전부
      containers:
        - name: spot-notice-exporter    # 룰 FailoverSpotNotice가 이 이름으로 출처를 고정한다. 바꾸면 룰도 같이
          image: python:3.12.15-alpine3.23
          command: [python, -u, /app/exporter.py]
          ports:
            - {name: metrics, containerPort: 9105}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: app, mountPath: /app, readOnly: true}
      volumes:
        - name: app
          configMap: {name: spot-notice-exporter}
