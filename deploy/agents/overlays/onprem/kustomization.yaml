# 관리 클러스터(온프레미스, API 172.30.0.120). Gitops 레포 Application gpu-monitoring-agents(bootstrap/onprem/applications, automated)가 이 경로를 가리킨다.
# 네임스페이스 monitoring은 Gitops 레포(gpu-foundation)가 만든다 → 여기 없음
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - prometheus-agent-statefulset.yaml
configMapGenerator:
  # KSM 사용자 정의 리소스 지표 설정(MultiKueueCluster 펜싱 라벨 · JobSet 실패 시각). 관리 클러스터에만 있는 리소스라 base가 아니라 여기
  - name: ksm-custom-resources
    namespace: monitoring
    files: [ksm-custom-resources.yaml]
patches:
  - target: {kind: Deployment, name: kube-state-metrics}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --custom-resource-state-config-file=/etc/ksm/ksm-custom-resources.yaml
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts
        value: [{name: custom-resources, mountPath: /etc/ksm, readOnly: true}]
      - op: add
        path: /spec/template/spec/volumes
        value: [{name: custom-resources, configMap: {name: ksm-custom-resources}}]
  # 위 설정이 읽는 리소스의 권한. KSM은 CRD 목록도 읽어야 한다(KSM 문서 「RBAC-enabled Clusters」)
  - target: {kind: ClusterRole, name: kube-state-metrics}
    patch: |-
      - op: add
        path: /rules/-
        value: {apiGroups: [kueue.x-k8s.io], resources: [multikueueclusters], verbs: [list, watch]}
      - op: add
        path: /rules/-
        value: {apiGroups: [jobset.x-k8s.io], resources: [jobsets], verbs: [list, watch]}
      - op: add
        path: /rules/-
        value: {apiGroups: [apiextensions.k8s.io], resources: [customresourcedefinitions], verbs: [list, watch]}
  # 1개짜리(Agent · KSM · 게이트웨이)는 워커 노드에. 플랫폼 앱과 같은 관례(platform-worker=true). DaemonSet은 전 노드라 제외
  - target: {kind: Deployment}
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value: {platform-worker: "true"}
  # Agent는 2개짜리 StatefulSet(prometheus-agent-statefulset.yaml)으로 둔다 → base의 1개짜리 Deployment는 뺀다
  - target: {kind: Deployment, name: prometheus-agent}
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: prometheus-agent}
  - target: {kind: Deployment, name: otel-gateway}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: otel-gateway}
      spec:
        template:
          spec:
            containers:
              - name: otel-collector
                env:
                  - {name: CLUSTER_NAME, value: onprem-manager}
                  - {name: SITE, value: onprem}
