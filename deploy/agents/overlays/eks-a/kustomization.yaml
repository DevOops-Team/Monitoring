# 워커 EKS a (devoops-prod-eks-a, us-east-2). 공통 수집 층(base) + GPU 노드용(gpu, dcgm-exporter).
# 노드 라벨 · taint는 IaC terraform/modules/eks 기준: CPU 노드 workload=system(온디맨드 1대), GPU 노드 devoops/gpu=true + taint nvidia.com/gpu.
# 적용: KUBECONFIG=<eks-a> kubectl apply -k deploy/agents/overlays/eks-a (EKS API가 비공개라 VPN이 붙은 상태에서). ArgoCD Application 등록은 Gitops 레포에서 따로
# WAL · 게이트웨이 큐는 base 그대로 hostPath: EKS에 EBS CSI 애드온이 없고 CPU 노드가 1대 고정이라 Pod가 다른 노드로 옮겨 갈 일이 없다
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml              # EKS에는 monitoring 네임스페이스를 만들어 주는 곳이 아직 없다
  - ../../base
  - ../../gpu
patches:
  # 1개짜리(Agent · KSM · 게이트웨이)는 CPU 노드에: GPU 노드는 스팟이라 회수되면 수집 파이프가 같이 죽는다. DaemonSet은 전 노드라 제외
  - target: {kind: Deployment}
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value: {workload: system}
  # 인스턴스 타입(g4dn.xlarge · 2xlarge)을 kube_node_labels로: CPU에 묶인 지표를 타입별로 보기 위해 (MON-STD-06).
  # test가 먼저 실패하면 base의 args 순서가 바뀐 것이니 아래 번호를 맞춘다
  - target: {kind: Deployment, name: kube-state-metrics}
    patch: |-
      - op: test
        path: /spec/template/spec/containers/0/args/3
        value: --metric-labels-allowlist=pods=[devoops/job-id,devoops/generation]
      - op: replace
        path: /spec/template/spec/containers/0/args/3
        value: --metric-labels-allowlist=pods=[devoops/job-id,devoops/generation],nodes=[node.kubernetes.io/instance-type]
  - target: {kind: Deployment, name: prometheus-agent}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: prometheus-agent}
      spec:
        template:
          spec:
            containers:
              - name: prometheus
                env:
                  - {name: CLUSTER_NAME, value: eks-a}
                  - {name: SITE, value: aws}
  - target: {kind: Deployment, name: otel-gateway}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: otel-gateway}
      spec:
        template:
          spec:
            containers:
              - name: otel-collector
                env:
                  - {name: CLUSTER_NAME, value: eks-a}
                  - {name: SITE, value: aws}
