apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  labels:
    app.kubernetes.io/name: kube-state-metrics
spec:
  replicas: 1                     # API 서버가 전체 상태를 한 번에 주므로 1개로 충분. 죽으면 다시 떠서 전부 다시 읽는다(버퍼 불필요)
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-state-metrics
    spec:
      serviceAccountName: kube-state-metrics
      automountServiceAccountToken: true
      securityContext:
        runAsUser: 65534
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.20.0
          args:
            - --port=8080
            - --telemetry-port=8081
            # rbac.yaml의 ClusterRole과 같은 목록. 늘리면 둘 다 고친다
            - --resources=nodes,pods,namespaces,persistentvolumeclaims,deployments,daemonsets,statefulsets,replicasets,jobs
            # kube_pod_labels는 기본적으로 라벨을 안 싣는다(카디널리티). 분류기가 Pod→job_id·세대를 Mimir에서 조회하려면 이 두 라벨만 허용
            - --metric-labels-allowlist=pods=[devoops/job-id,devoops/generation]
          ports:
            - {name: http-metrics, containerPort: 8080}
            - {name: telemetry, containerPort: 8081}
          livenessProbe:
            httpGet: {path: /livez, port: http-metrics}
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /readyz, port: telemetry}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  labels:
    app.kubernetes.io/name: kube-state-metrics
spec:
  clusterIP: None                 # Agent가 Pod를 직접 긁는다(복제 1이라 Service 경유와 같지만 Pod가 바뀌어도 instance가 섞이지 않음)
  selector:
    app.kubernetes.io/name: kube-state-metrics
  ports:
    - {name: http-metrics, port: 8080, targetPort: http-metrics}
    - {name: telemetry, port: 8081, targetPort: telemetry}
