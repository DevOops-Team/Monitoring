# 노드마다 하나. 노드 디스크의 원본(컨테이너 로그 파일 · journald)을 읽어 OTel 게이트웨이로 OTLP push 한다.
# 마스터 노드에도 뜬다(toleration Exists): apiserver · etcd · scheduler 로그가 /var/log/pods에, kubelet · containerd · 커널이 journald에 있다.
# 디스크 보호: 읽은 위치(책갈피 db)와 미전송 버퍼(storage.path)를 hostPath에 둔다 → 재시작해도 이어 읽고, 게이트웨이가 죽어 있어도 쌓아 둔다.
# root로 돈다: /var/log/pods · journal 파일이 root 전용이라서. 쓰는 곳은 hostPath 한 군데뿐
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  labels:
    app.kubernetes.io/name: fluent-bit
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: fluent-bit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fluent-bit
    spec:
      serviceAccountName: fluent-bit
      tolerations:
        - operator: Exists          # control-plane · spare · faulty 어떤 taint든 전 노드
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: fluent-bit
          image: fluent/fluent-bit:5.1.1
          args: [-c, /fluent-bit/etc/conf/fluent-bit.yaml]
          ports:
            - {name: http, containerPort: 2020}   # 상태 · 자체 지표(/api/v2/metrics/prometheus)
          livenessProbe:
            httpGet: {path: /api/v1/health, port: http}
            periodSeconds: 30
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /fluent-bit/etc/conf, readOnly: true}
            - {name: varlog, mountPath: /var/log, readOnly: true}            # containers/ · pods/ · journal/
            - {name: runlog, mountPath: /run/log, readOnly: true}            # journald가 메모리 저장(Storage=volatile)일 때 위치
            - {name: state, mountPath: /var/lib/monitoring-agents/fluent-bit}
      volumes:
        - name: config
          configMap: {name: fluent-bit-config}
        - name: varlog
          hostPath: {path: /var/log}
        - name: runlog
          hostPath: {path: /run/log, type: DirectoryOrCreate}
        - name: state
          hostPath:
            path: /var/lib/monitoring-agents/fluent-bit
            type: DirectoryOrCreate
