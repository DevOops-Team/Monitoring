# 클러스터 안 Prometheus Agent 설정. 긁어서 모니터링 클러스터 Mimir로 보내기만 한다.
# 어느 클러스터에서나 같은 파일을 쓴다: 클러스터 이름은 env(CLUSTER_NAME · SITE)로 들어온다(Deployment env, overlay가 정함)
global:
  scrape_interval: 15s             # dcgm-exporter 내부 수집 5s + scrape 15s 전제 (fault-event ±45s 창)
  external_labels:
    cluster: ${CLUSTER_NAME}       # 예: onprem-manager · eks-a
    site: ${SITE}                  # onprem · aws
    # Agent를 2개 두는 클러스터(관리 클러스터)에서만 값이 들어온다. Mimir가 같은 agent_group 안에서 한 Agent 것만 받고,
    # __replica__는 저장 전에 지운다(모니터링 클러스터 mimir.yaml의 ha_tracker). env가 없으면 값이 비어
    # 라벨 자체가 붙지 않는다(EKS: Agent 1개, 「Empty environment variable」 경고만 남는다)
    agent_group: ${AGENT_GROUP}
    __replica__: ${POD_NAME}

remote_write:
  # 모니터링 클러스터 서비스 VIP. LAN이든 VPN 너머든 같은 주소. 끊기면 WAL(기본 최대 약 2시간치)에 쌓였다가 복구 뒤 전송
  - url: http://172.30.0.35:9009/api/v1/push
    queue_config:
      # Mimir가 수신 한도로 거절(429)하면 기본 동작은 그 샘플을 버리는 것이다. 버리지 않고 WAL에 둔 채 다시 보낸다
      # (11/16 Mimir 재시작 직후 밀린 전송이 한도에 걸려 8.8만 샘플을 잃었다). 한도를 넘는 동안은 도착이 늦어질 뿐이다
      retry_on_http_429: true

scrape_configs:
  # Agent 자신. localhost로 긁으면 2개일 때 Mimir가 뽑은 쪽 지표만 남으므로 Pod마다 긁는다(1개여도 같은 방식)
  - job_name: prometheus-agent
    kubernetes_sd_configs:
      - role: endpointslice
        namespaces: {names: [monitoring]}
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_name, __meta_kubernetes_endpointslice_port_name]
        regex: prometheus-agent;http
        action: keep
      - {source_labels: [__meta_kubernetes_pod_name], target_label: pod}

  # kubelet: 노드마다 하나. ServiceAccount 토큰 인증. 서버 인증서가 노드별 자체 서명이라 검증은 건너뛴다(11/09 결정)
  - job_name: kubelet
    scheme: https
    kubernetes_sd_configs:
      - role: node
    authorization:
      credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    tls_config:
      insecure_skip_verify: true
    relabel_configs:
      - {source_labels: [__meta_kubernetes_node_name], target_label: node}

  # 컨테이너 자원 지표(kubelet 내장 cAdvisor)
  - job_name: cadvisor
    scheme: https
    metrics_path: /metrics/cadvisor
    honor_timestamps: false        # cAdvisor 자체 타임스탬프를 쓰면 out-of-order로 버려지는 샘플이 생긴다
    kubernetes_sd_configs:
      - role: node
    authorization:
      credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    tls_config:
      insecure_skip_verify: true
    relabel_configs:
      - {source_labels: [__meta_kubernetes_node_name], target_label: node}
    metric_relabel_configs:
      # Pod가 아닌 cgroup(시스템 슬라이스)과 이름 없는 컨테이너(pause)는 버린다 → 시계열 수 절반 이하
      - source_labels: [container]
        regex: "|POD"
        action: drop

  # node-exporter DaemonSet: 노드 OS 지표. hostNetwork라 Pod 주소가 곧 노드 IP:9100.
  # job · node 라벨은 모니터링 클러스터 쪽(deploy/base)과 같게 두어 대시보드 · 룰을 같이 쓴다
  - job_name: node-exporter
    kubernetes_sd_configs:
      - role: pod
        namespaces: {names: [monitoring]}
        attach_metadata: {node: true}   # 아래 node_role을 만들 노드 라벨을 읽는다
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name, __meta_kubernetes_pod_container_port_name]
        regex: node-exporter;metrics
        action: keep
      - {source_labels: [__meta_kubernetes_pod_node_name], target_label: node}
      # EKS 노드 이름은 전부 ip-…라 이름으로는 종류를 알 수 없다. 노드 라벨로 node_role을 붙여 대시보드 범례에 쓴다:
      # GPU 노드는 devoops/node-role(training · spare), CPU 노드는 workload=system. 두 라벨이 없는 온프레 노드에는 붙지 않는다
      - {source_labels: [__meta_kubernetes_node_label_devoops_node_role], regex: (.+), target_label: node_role}
      - {source_labels: [__meta_kubernetes_node_label_workload], regex: (system), target_label: node_role}

  # kube-state-metrics: Pod · 노드 · 워크로드 상태. 헤드리스 Service의 엔드포인트를 긁는다
  - job_name: kube-state-metrics
    kubernetes_sd_configs:
      - role: endpointslice
        namespaces: {names: [monitoring]}
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_name, __meta_kubernetes_endpointslice_port_name]
        regex: kube-state-metrics;http-metrics
        action: keep

  # 수집 층 자신의 지표: 게이트웨이(큐 길이 · 전송 실패 otelcol_exporter_*) · Fluent Bit(입력 · 출력 · 재시도 fluentbit_*)
  - job_name: otel-gateway
    kubernetes_sd_configs:
      - role: pod
        namespaces: {names: [monitoring]}
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name, __meta_kubernetes_pod_container_port_name]
        regex: otel-gateway;metrics
        action: keep
      - {source_labels: [__meta_kubernetes_pod_node_name], target_label: node}
    # 게이트웨이 자기 지표에 점 라벨(server.address · server.port)이 있음. Prometheus 3는 UTF-8 라벨을 통과시키지만
    # Mimir는 400으로 거절하고, Agent는 400을 복구 불가로 보고 그 배치(2000샘플) 전체를 버린다 → 다른 지표까지 유실.
    # 점 라벨은 exporter 라벨과 중복 정보라 여기서 떨어낸다 (11/10 관리 클러스터 첫 수집에서 발견)
    metric_relabel_configs:
      - {action: labeldrop, regex: '.+\..+'}
  - job_name: fluent-bit
    metrics_path: /api/v2/metrics/prometheus
    kubernetes_sd_configs:
      - role: pod
        namespaces: {names: [monitoring]}
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name, __meta_kubernetes_pod_container_port_name]
        regex: fluent-bit;http
        action: keep
      - {source_labels: [__meta_kubernetes_pod_node_name], target_label: node}

  # Kueue 컨트롤러: 큐 대기 잡 수 · 입장 대기 시간(kueue_pending_workloads · kueue_admission_wait_time_seconds).
  # :8443은 HTTPS + 토큰 인증이고 /metrics 읽기 권한은 rbac.yaml의 nonResourceURLs로 이미 있다. 인증서는 자체 서명이라 검증은 건너뛴다.
  # Pod가 여러 개(관리 클러스터 3)면 모두 같은 큐 지표를 낸다(그냥 sum하면 Pod 수만큼 배가 된다)
  # → 패널 · 룰에서는 Kueue가 붙이는 라벨 replica_role="leader"로 고를 것.
  # Kueue가 없는 클러스터에서는 타깃이 0개일 뿐이다
  - job_name: kueue
    scheme: https
    kubernetes_sd_configs:
      - role: pod
        namespaces: {names: [kueue-system]}
    authorization:
      credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    tls_config:
      insecure_skip_verify: true
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name, __meta_kubernetes_pod_container_port_name]
        regex: kueue;metrics
        action: keep
      - {source_labels: [__meta_kubernetes_namespace], target_label: namespace}
      - {source_labels: [__meta_kubernetes_pod_name], target_label: pod}
      - {source_labels: [__meta_kubernetes_pod_node_name], target_label: node}

  # 어노테이션으로 노출을 선언한 Pod(prometheus.io/scrape · port · path). 학습 Job trainer :8000(training-metrics.md) 등.
  # 포트는 어노테이션 값으로 바꿔 끼운다(컨테이너가 여러 포트를 열어도 하나만 긁는다)
  - job_name: annotated-pods
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        regex: "true"
        action: keep
      - source_labels: [__meta_kubernetes_pod_phase]
        regex: Running
        action: keep
      # init 컨테이너도 타깃이 돼 같은 주소를 컨테이너 수만큼 긁는다(argocd haproxy Pod가 3번) → 제외
      - source_labels: [__meta_kubernetes_pod_container_init]
        regex: "true"
        action: drop
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        regex: (.+)
        target_label: __metrics_path__
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - {source_labels: [__meta_kubernetes_namespace], target_label: namespace}
      - {source_labels: [__meta_kubernetes_pod_name], target_label: pod}
      - {source_labels: [__meta_kubernetes_pod_node_name], target_label: node}
      - {source_labels: [__meta_kubernetes_pod_container_name], target_label: container}
