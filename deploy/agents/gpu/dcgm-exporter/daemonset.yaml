# GPU 노드마다 하나. GPU 상태(온도 · 클럭 제한 · ECC · Xid · 사용률)를 Pod IP:9400으로 연다.
# 공식 예시(dcgm-exporter 4.8.4 deployment/examples/dcgm-exporter.yaml)에서 바꾼 것만 적는다:
#   - 필드 목록을 우리 것으로(counters.csv), 수집 주기 30초 → 5초 (fault-event dedup ±45초 창의 전제)
#   - GPU 노드에만, 어떤 taint든 통과 (nvidia.com/gpu · devoops/spare · devoops/faulty)
#   - Service 없음: Agent의 annotated-pods 잡이 어노테이션을 보고 Pod를 직접 긁는다
#   - SYS_ADMIN 뺌: 공식 예시가 프로파일링 지표(DCGM_FI_PROF_*)에만 필요하다고 적었고 counters.csv에 그 지표가 없다. 넣게 되면 같이 되살린다
#   - DCGM 엔진을 사이드카(nv-hostengine)로 뺌(GPU-92): 내장 엔진이면 dcgmi test --inject로 넣은 가짜 Xid가 지표에 안 나온다.
#     exporter는 -r로 옆 엔진(localhost:5555)에 붙기만 한다. 엔진이 NVML로 GPU를 읽는 방식은 내장과 같아 진짜 장애도 똑같이 잡힌다
#     이미지는 공식 DCGM 이미지(받으면 약 7.3GB, GPU 노드 루트 디스크 21.4GB)가 아니라 core 패키지만 담은 우리 것(dcgm-hostengine/Dockerfile)
# root는 공식 예시 그대로 둔다(capability는 전부 뺀 상태). 비root · 읽기 전용 루트는 GPU 노드에서 기동을 확인한 뒤에 바꾼다
# 드라이버는 노드(AL2023 NVIDIA AMI)의 것을 쓴다
# 주입한 값은 엔진 캐시에 엔진이 재시작될 때까지 남는다 → 시험이 끝나면 그 노드의 Pod를 지운다(deploy/README.md 「장애 주입」)
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: dcgm-exporter
  labels:
    app.kubernetes.io/name: dcgm-exporter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: dcgm-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dcgm-exporter
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9400"
    spec:
      automountServiceAccountToken: false
      priorityClassName: system-node-critical
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      nodeSelector:
        devoops/gpu: "true"
      tolerations:
        - operator: Exists          # GPU taint · 예비 · 고장 어떤 taint든 GPU 노드 전부
      imagePullSecrets:
        - name: ghcr-pull           # dcgm-hostengine이 GHCR 비공개. EKS monitoring의 Secret은 IaC eks-hub-registration이 만든다
      initContainers:
        # native sidecar(restartPolicy Always): exporter보다 먼저 뜨고 Pod가 끝날 때까지 같이 산다(쿠버네티스 1.29+, EKS 1.35)
        - name: nv-hostengine
          image: ghcr.io/devoops-team/dcgm-hostengine:1.8.0
          restartPolicy: Always
          # 엔진은 127.0.0.1에서만 열어 kubelet의 tcp probe는 닿지 않는다. 같은 컨테이너의 dcgmi가 붙으면 뜬 것
          # (GPU를 못 받아도 엔진은 「GPU 0개」로 뜬다 → GPU를 잡았는지는 exporter 지표 개수로 본다)
          startupProbe:
            exec: {command: [dcgmi, discovery, -l]}
            periodSeconds: 2
            failureThreshold: 30
          resources:
            # 실측 전 임시값. 내장일 때 exporter 전체가 약 435MiB였다(11/19)
            requests: {cpu: 50m, memory: 256Mi}
            limits: {memory: 1Gi}
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
      containers:
        - name: dcgm-exporter
          image: nvcr.io/nvidia/k8s/dcgm-exporter:4.6.1-4.8.4-distroless
          args:
            - -f
            - /etc/dcgm-exporter/custom/counters.csv
            - -r                                        # 내장 엔진 대신 사이드카 엔진에 붙는다
            - localhost:5555
          env:
            - {name: DCGM_EXPORTER_LISTEN, value: ":9400"}
            - {name: DCGM_EXPORTER_INTERVAL, value: "5000"}     # ms. 기본 30000
            # kubelet pod-resources로 "이 GPU를 쓰는 Pod"를 지표에 붙인다.
            # Agent가 붙이는 pod · namespace · container(exporter 자신)와 이름이 겹쳐 학습 Pod 쪽은 exported_pod 등으로 들어온다
            - {name: DCGM_EXPORTER_KUBERNETES, value: "true"}
            - name: NODE_NAME
              valueFrom:
                fieldRef: {fieldPath: spec.nodeName}
          ports:
            - {name: metrics, containerPort: 9400}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            # 256Mi에서는 초기화 직후 OOMKilled로 계속 재시작했다(11/19 EKS g4dn.xlarge 10대 전부). 1Gi는 일단 살리려는 값이고,
            # 실제 최대 사용량을 잰 뒤 줄인다
            limits: {memory: 1Gi}
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: counters, mountPath: /etc/dcgm-exporter/custom, readOnly: true}
            - {name: pod-resources, mountPath: /var/lib/kubelet/pod-resources, readOnly: true}
      volumes:
        - name: counters
          configMap: {name: dcgm-exporter-counters}
        - name: pod-resources
          hostPath: {path: /var/lib/kubelet/pod-resources, type: Directory}
