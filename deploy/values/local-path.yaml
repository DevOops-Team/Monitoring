# StorageClass "local-path": PVC가 오면 그 Pod가 뜬 노드의 /opt/local-path-provisioner 아래에 폴더를 만들어 준다.
# compose의 named volume과 같은 역할. PV는 그 노드에 묶인다(노드가 죽으면 그 디스크도 못 씀 → 3노드 복제로 보완)
storageClass:
  create: true
  defaultClass: true
  name: local-path
  reclaimPolicy: Delete          # PVC를 지우면 폴더도 지움. 데이터 보존이 필요한 삭제는 README 절차를 따른다
helperImage:
  tag: "1.37.0"                  # 기본 latest 대신 고정
resources:
  requests: {cpu: 10m, memory: 32Mi}
  limits: {memory: 128Mi}
