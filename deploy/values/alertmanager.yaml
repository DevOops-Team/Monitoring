# compose/alertmanager/alertmanager.yml을 그대로 옮긴 것. 시크릿은 Secret alertmanager-secrets를 /run/secrets에 마운트해
# compose 때와 같은 *_file 경로로 읽는다 (scripts/create-secrets.sh가 만든다. 레포에 없음)
fullnameOverride: alertmanager
# 2개(가십, 과반 불필요). 차트가 --cluster.peer와 headless Service 9094를 자동으로 넣는다.
# 알람을 보내는 쪽(Mimir · Loki ruler)은 Service 하나가 아니라 두 Pod 모두에게 보낸다 (docs/monitoring-ha.md 3.1)
replicaCount: 2
podAntiAffinity: hard            # 두 Pod를 서로 다른 노드에 (차트 기본은 꺼짐)
podDisruptionBudget:
  maxUnavailable: 1

extraSecretMounts:
  - name: secrets
    mountPath: /run/secrets
    secretName: alertmanager-secrets   # 키: slack_webhook_url · healthchecks_ping_url
    readOnly: true

persistence:
  enabled: true
  storageClass: local-path
  size: 1Gi

# 클러스터 밖 주소 172.30.0.35:9093 (복구 컨트롤러의 Watchdog 확인, 사람)
service:
  type: LoadBalancer
  port: 9093
  annotations:
    kube-vip.io/loadbalancerIPs: "172.30.0.35"

resources:
  requests: {cpu: 20m, memory: 64Mi}
  limits: {memory: 192Mi}

# 설정 리로더 사이드카는 쓰지 않는다. 설정은 helm upgrade로만 바뀌고, 그때 Pod가 다시 뜨면 충분하다
# (silence · 알림 기록은 PVC에 남는다)
configmapReload:
  enabled: false

# 라우팅: Watchdog → healthchecks.io (데드맨), RecoveryHold → Slack(해결 알림 없음), 나머지 → Slack #alerts-gpu
# 분류기용 원인 알람(pipeline=failover)은 Slack으로 보내지 않는다. Xid · Pod 종료는 분류기 웹훅으로, 사이트는 아직 받는 곳 없는 수신자로
config:
  global:
    slack_api_url_file: /run/secrets/slack_webhook_url
  templates: []
  route:
    receiver: slack
    group_by: [alertname]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - matchers: ["alertname = Watchdog"]
        receiver: deadman
        group_wait: 0s
        group_interval: 1m
        repeat_interval: 1m      # healthchecks.io 체크 period 1m · grace 4m → 미수신 5m에 알림
      # 원인 알람은 사람이 아니라 분류기가 읽는다 (docs/classifier.md 2절). Xid · Pod 종료 · 사이트를 분류기로 보낸다
      # 사이트(GPU-220): 펜싱된(일부러 끈) EKS는 룰에서 빠진다. 분류기 ENABLED_SIGNALS에도 site가 있어야 받는다(Gitops)
      - matchers: ["pipeline = failover", 'signal =~ "xid|pod_exit|site"']
        receiver: classifier
        group_by: [alertname, cluster, node, pod, gpu_uuid]   # 사건 하나 = 알림 하나
        group_wait: 0s           # 원인 알람은 약 30초만 발화한다. 기다리면 그 사이 꺼져서 못 보낸다
        group_interval: 1m
        repeat_interval: 1m      # 분류기가 503을 주면 다시 보낸다. 중복은 분류기가 거른다 (docs/classifier.md 8절)
      # 그 밖의 원인 알람(스팟 등 아직 분류기가 안 받는 것)은 Alertmanager 화면에서만 보인다
      - matchers: ["pipeline = failover"]
        receiver: classifier-pending
      # HOLD는 "일어난 사건"이라 룰이 약 5분 발화하고 꺼진다. 꺼짐 = 해결이 아니므로 resolved를 보내지 않는 수신자로.
      # job·사유별로 따로 묶어 여러 HOLD가 한 메시지에 뭉치지 않게 한다 (MON-STD-25)
      - matchers: ["alertname = RecoveryHold"]
        receiver: slack-event
        group_by: [alertname, cluster, job_id, reason]
  receivers:
    - name: classifier
      webhook_configs:
        - url: http://classifier.monitoring.svc:8080/alerts
          send_resolved: false   # 분류기는 resolved를 버린다
    - name: classifier-pending   # 받는 곳 없음(위 라우트 주석)
    - name: slack
      slack_configs:
        - channel: "#alerts-gpu"
          send_resolved: true
          title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
          text: >-
            {{ range .Alerts }}• {{ .Annotations.summary }}
            {{ if .Labels.instance }}({{ .Labels.instance }}){{ end }}
            {{ end }}
    - name: slack-event
      slack_configs:
        - channel: "#alerts-gpu"
          send_resolved: false
          title: '[HOLD] {{ .CommonLabels.alertname }}'
          text: >-
            {{ range .Alerts }}• {{ .Annotations.summary }}
            {{ end }}
    - name: deadman
      webhook_configs:
        - url_file: /run/secrets/healthchecks_ping_url
          send_resolved: false
