# blackbox_exporter: 밖에서 찔러 보는 probe. 지금 대상은 pfSense LAN 게이트웨이와 인터넷(공인 DNS).
# VPN 터널 · 워커 쪽 probe는 AWS 재구축 뒤 Agent 설정(base/prometheus-agent/prometheus.yml)에 대상만 추가
fullnameOverride: blackbox-exporter
config:
  modules:
    icmp:
      prober: icmp
      timeout: 5s
      icmp:
        preferred_ip_protocol: ip4
    http_2xx:
      prober: http
      timeout: 5s
      http:
        preferred_ip_protocol: ip4
# ICMP 소켓을 열려면 NET_RAW가 필요하다
securityContext:
  runAsUser: 1000
  runAsGroup: 1000
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
    add: ["NET_RAW"]
resources:
  requests: {cpu: 10m, memory: 32Mi}
  limits: {memory: 96Mi}
