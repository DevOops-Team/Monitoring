# 모니터링 클러스터의 오브젝트 상태(Pod 재시작 · 준비 · Deployment/StatefulSet 복제 · PVC).
# 관리 클러스터는 deploy/agents/base/kube-state-metrics(자체 매니페스트, ArgoCD)이고, 여기는 같은 KSM 버전을 차트로 올린다
fullnameOverride: kube-state-metrics
# 관리 클러스터 --resources와 같은 목록(대시보드 쿼리를 두 클러스터에서 같이 쓰려고). 차트가 이 목록으로 ClusterRole을 만든다
collectors: [nodes, pods, namespaces, persistentvolumeclaims, deployments, daemonsets, statefulsets, replicasets, jobs]
resources:
  requests: {cpu: 50m, memory: 128Mi}
  limits: {memory: 256Mi}
