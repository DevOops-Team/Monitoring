# scripts/classifier-e2e-kind.sh가 쓰는 kind 클러스터 모양 (kustomize 리소스 아님).
# 워커 2대: 한 노드에 학습 작업이 하나만 있어야 Xid 신호의 job_id를 찾을 수 있다
# worker3: GPU 노드 소실 단계에서 멈추고 지울 노드. taint로 KSM · Agent · Kafka · 분류기가 못 올라가게 한다(같이 죽으면 안 됨)
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
  - role: worker
  - role: worker
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          taints: [{key: devoops/e2e-node-lost, value: "true", effect: NoSchedule}]
