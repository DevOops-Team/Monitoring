# Loki 모놀리식 3개, 노드마다 하나(차트가 anti-affinity · memberlist를 넣는다). 청크 · 인덱스는 S3(접두어 loki/), PVC에는 WAL · 아직 안 올린 인덱스 · 캐시만 남는다.
# 로그를 3개 모두에 쓰고 2개가 받으면 성공 → 하나가 죽어도 수신 · 조회 · 룰 평가가 계속된다 (docs/monitoring-ha.md 3.3)
fullnameOverride: loki
deploymentMode: Monolithic

loki:
  auth_enabled: false            # 테넌트 하나
  commonConfig:
    replication_factor: 3
  storage:
    type: s3
    bucketNames:
      chunks: devoops-prod-monitoring-947027666399-us-east-2
      ruler: devoops-prod-monitoring-947027666399-us-east-2   # 차트가 값을 요구할 뿐, 룰은 아래 rulerConfig.storage.type: local이라 버킷을 안 쓴다
    # Loki 안의 S3 접속 코드를 옛것(자체 aws 클라이언트)에서 새것(Thanos 프로젝트의 objstore 라이브러리)으로 바꾼다.
    # Thanos 자체를 쓰는 것은 아니다. 옛 코드는 청크에 접두어를 못 붙이는데, 버킷을 Mimir · Tempo와 같이 쓰고 역할이 loki/* 만 허용한다
    use_thanos_objstore: true
    object_store:
      type: s3
      storage_prefix: loki
      s3:
        endpoint: s3.us-east-2.amazonaws.com
        region: us-east-2          # 비우면 GetBucketLocation을 부르는데 역할에 그 권한이 없다
        # 키를 설정에 두지 않는다. 같은 Pod의 aws-credentials 사이드카(아래 singleBinary.initContainers)가 준다
        native_aws_auth_enabled: true
  storage_config:
    use_thanos_objstore: true
  schemaConfig:
    configs:
      - from: "2026-11-01"
        store: tsdb
        object_store: s3         # 11/16 filesystem → s3. 기간을 나누지 않고 바꿨다: 그 전 PVC 로그는 버리기로 함(조회되지 않는다)
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    retention_period: 720h       # 30일 (ADR-18)
    deletion_mode: disabled      # 로그 삭제 API를 끈다(보존 기간 만료 삭제는 그대로 동작). 인증 없는 push 주소로 삭제 요청이 오는 것을 막음
  compactor:
    retention_enabled: true
    delete_request_store: s3
  # LogQL 알람 룰은 레포 deploy/monitoring-cluster/storage/loki/rules/*.yml → ConfigMap loki-rules → 아래 singleBinary.extraVolumeMounts로 Pod 안 파일
  rulerConfig:
    # Service 하나가 아니라 Alertmanager Pod 전부에게 보낸다: headless Service의 SRV 레코드로 Pod 목록을 찾는다 (docs/monitoring-ha.md 3.1)
    alertmanager_url: http://_http._tcp.alertmanager-headless.monitoring.svc.cluster.local
    enable_alertmanager_discovery: true
    # 룰을 Pod끼리 나눠 맡는다. 기본은 꺼짐이라, 안 켜면 3개가 모든 룰을 각자 평가해 같은 알람을 3번 낸다
    enable_sharding: true
    # use_thanos_objstore: true면 Loki는 이 ruler.storage를 무시하고 아래 structuredConfig.ruler_storage를 쓴다(Loki 3.7.9 pkg/loki/modules.go).
    # 그래도 남겨 둔다: 빼면 차트가 여기에 S3 설정을 렌더한다
    storage:
      type: local
  structuredConfig:
    # 차트는 use_thanos_objstore면 ruler_storage를 S3(loki/rules/)로 렌더한다. 룰은 버킷이 아니라 Pod 안 파일로 둔다(Mimir와 같게).
    # 디렉터리 구조 = <directory>/<테넌트>/<파일>. auth_enabled: false라 테넌트는 fake
    ruler_storage:
      backend: local
      local:
        directory: /etc/loki/rules

singleBinary:
  replicas: 3
  podDisruptionBudget:           # 노드 정비(drain) 때 한 번에 하나만 내려가게 (차트 기본은 켜져 있으나 값이 비어 있다)
    maxUnavailable: 1
  persistence:
    enabled: true
    storageClass: local-path
    size: 10Gi
  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {memory: 1536Mi}
  # S3 임시 키 공급. restartPolicy: Always = 사이드카(Loki보다 먼저 뜨고 Pod가 끝날 때까지 산다).
  # 인증서(Secret loki-s3-cert)로 IAM Roles Anywhere에서 1시간짜리 키를 받아 127.0.0.1:9911에 내놓고 만료 전에 갱신한다
  initContainers:
    - name: aws-credentials
      image: public.ecr.aws/rolesanywhere/credential-helper:1.8.5-2026.08.24.20.52
      restartPolicy: Always
      args:
        - serve
        - --port=9911
        - --certificate=/cert/client.pem
        - --private-key=/cert/client.key
        - --trust-anchor-arn=arn:aws:rolesanywhere:us-east-2:947027666399:trust-anchor/e64f2c94-9faa-4510-9e0d-b04c71170678
        - --profile-arn=arn:aws:rolesanywhere:us-east-2:947027666399:profile/b02bf523-d71c-440d-8da1-6b7c17f0f7a5
        - --role-arn=arn:aws:iam::947027666399:role/devoops-prod-onprem-loki
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {memory: 64Mi}
      volumeMounts:
        - {name: s3-cert, mountPath: /cert, readOnly: true}
  extraEnv:
    # AWS SDK가 EC2 메타데이터 대신 사이드카에 키를 물어보게 한다
    - {name: AWS_EC2_METADATA_SERVICE_ENDPOINT, value: "http://127.0.0.1:9911"}
  extraVolumes:
    - name: s3-cert
      secret: {secretName: loki-s3-cert}   # scripts/create-secrets.sh s3-certs
    - name: rules
      configMap: {name: loki-rules}        # deploy/monitoring-cluster/storage(kustomization.yaml)가 만든다. 차트의 ruler.directories는 모놀리식에서 ConfigMap을 안 만들어 쓰지 않는다
  extraVolumeMounts:
    - {name: rules, mountPath: /etc/loki/rules/fake, readOnly: true}
  # Service는 차트 기본(ClusterIP). 밖으로는 base/external/services.yaml의 loki-external이 3100만 연다

# 모놀리식만 쓴다. 차트 기본은 simple scalable 구성요소(write · read · backend)도 복제 수가 있어 0으로 내린다
write:
  replicas: 0
read:
  replicas: 0
backend:
  replicas: 0

# 이 규모에 필요 없는 부속을 끈다: 앞단 nginx, memcached 2종, 자기 시험용 canary, helm test, 룰 사이드카
gateway:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
sidecar:
  rules:
    enabled: false
# 클러스터 범위 RBAC를 만들지 않는다(룰 사이드카를 껐으므로 필요 없음)
rbac:
  namespaced: true
