# Agent는 저장하지 않지만 WAL(보내기 전 버퍼)은 재시작에도 남아야 하므로 PVC를 가진 StatefulSet으로 둔다.
# 2개가 같은 대상을 긁어 둘 다 Mimir로 보내고, Mimir(HA tracker)가 한쪽 것만 저장한다. 뽑힌 쪽이 죽으면
# 30초 뒤 다른 쪽으로 넘어가고 그 사이 샘플은 빈다 (docs/monitoring-ha.md 3.4)
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: prometheus-agent
  labels:
    app.kubernetes.io/name: prometheus-agent
spec:
  serviceName: prometheus-agent
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus-agent
    spec:
      serviceAccountName: prometheus-agent
      affinity:
        podAntiAffinity:               # 두 Agent를 서로 다른 노드에
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: prometheus-agent
      securityContext:
        fsGroup: 65534               # prom/prometheus 이미지의 nobody
        runAsUser: 65534
        runAsNonRoot: true
      containers:
        - name: prometheus
          image: prom/prometheus:v3.15.1
          args:
            - --agent
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.agent.path=/prometheus
            - --web.enable-lifecycle
          env:
            - name: POD_NAME           # prometheus.yml의 __replica__ 값 (Agent마다 달라야 한다)
              valueFrom:
                fieldRef: {fieldPath: metadata.name}
          ports:
            - {name: http, containerPort: 9090}
          readinessProbe:
            httpGet: {path: /-/ready, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 768Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus}
            - {name: wal, mountPath: /prometheus}
      volumes:
        - name: config
          configMap: {name: prometheus-agent-config}
  volumeClaimTemplates:
    - metadata:
        name: wal
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests:
            storage: 2Gi
---
# StatefulSet이 요구하는 헤드리스 서비스. Agent UI(대상 상태 확인)는 kubectl port-forward svc/prometheus-agent 9090
apiVersion: v1
kind: Service
metadata:
  name: prometheus-agent
  labels:
    app.kubernetes.io/name: prometheus-agent
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: prometheus-agent
  ports:
    - {name: http, port: 9090, targetPort: http}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: prometheus-agent
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus-agent
