# promtool test rules. scripts/deploy-k8s.sh의 lint 단계가 돌린다
rule_files:
  - ../rules/infra.yml
evaluation_interval: 15s

tests:
  # 1) pg_up이 5분에 0으로 떨어진다 → 2분 지나야 울리고, 돌아오면 꺼진다
  - name: PostgreSQL 접속이 2분 넘게 끊기면 울린다
    interval: 15s
    input_series:
      - series: 'pg_up{job="postgres-exporter", cluster="monitoring"}'
        values: '1x20 0x20 1x20'
    alert_rule_test:
      - eval_time: 6m
        alertname: PostgresDown
        exp_alerts: []
      - eval_time: 8m
        alertname: PostgresDown
        exp_alerts:
          - exp_labels: {severity: critical, job: postgres-exporter, cluster: monitoring}
            exp_annotations:
              summary: 'PostgreSQL(172.30.0.50) 접속 불가 — 수집기가 이벤트를 DB에 쓰지 못한다'
              standard: MON-STD-13
      - eval_time: 12m
        alertname: PostgresDown
        exp_alerts: []

  # 2) 파티션 3개 합이 1500(-1인 파티션은 뺀다). 10분 지나야 울린다. 다른 토픽(합 900)과 다른 그룹은 안 울린다
  - name: 수집기 lag이 10분 넘게 1000을 넘으면 울린다
    interval: 15s
    input_series:
      - series: 'kafka_consumergroup_lag{job="kafka-exporter", consumergroup="data-collector", topic="job.lifecycle", partition="0"}'
        values: '700x80'
      - series: 'kafka_consumergroup_lag{job="kafka-exporter", consumergroup="data-collector", topic="job.lifecycle", partition="1"}'
        values: '800x80'
      - series: 'kafka_consumergroup_lag{job="kafka-exporter", consumergroup="data-collector", topic="job.lifecycle", partition="2"}'
        values: '-1x80'
      - series: 'kafka_consumergroup_lag{job="kafka-exporter", consumergroup="data-collector", topic="gpu.fault", partition="0"}'
        values: '900x80'
      - series: 'kafka_consumergroup_lag{job="kafka-exporter", consumergroup="other", topic="job.lifecycle", partition="0"}'
        values: '5000x80'
    alert_rule_test:
      - eval_time: 9m
        alertname: CollectorLagHigh
        exp_alerts: []
      - eval_time: 11m
        alertname: CollectorLagHigh
        exp_alerts:
          - exp_labels: {severity: warning, consumergroup: data-collector, topic: job.lifecycle}
            exp_annotations:
              summary: '수집기(data-collector)가 job.lifecycle을(를) 못 따라감: 안 읽은 메시지 1500건이 10분째 — DB 반영이 늦는다'
              standard: MON-STD-23

  # 3) kafka1 85% → 경고만, pfsense 95% → 경고 · 위험 둘 다, db 50% · 루트가 아닌 마운트 · 다른 job은 안 울린다
  - name: VM · pfSense 루트 디스크 80 · 90%
    interval: 15s
    input_series:
      - series: 'node_filesystem_size_bytes{job="vm-host", host="kafka1", mountpoint="/"}'
        values: '100x40'
      - series: 'node_filesystem_avail_bytes{job="vm-host", host="kafka1", mountpoint="/"}'
        values: '15x40'
      - series: 'node_filesystem_size_bytes{job="pfsense-host", host="pfsense", mountpoint="/"}'
        values: '100x40'
      - series: 'node_filesystem_avail_bytes{job="pfsense-host", host="pfsense", mountpoint="/"}'
        values: '5x40'
      - series: 'node_filesystem_size_bytes{job="vm-host", host="db", mountpoint="/"}'
        values: '100x40'
      - series: 'node_filesystem_avail_bytes{job="vm-host", host="db", mountpoint="/"}'
        values: '50x40'
      - series: 'node_filesystem_size_bytes{job="vm-host", host="db", mountpoint="/boot"}'
        values: '100x40'
      - series: 'node_filesystem_avail_bytes{job="vm-host", host="db", mountpoint="/boot"}'
        values: '1x40'
      - series: 'node_filesystem_size_bytes{job="pve-host", host="pve1", mountpoint="/"}'
        values: '100x40'
      - series: 'node_filesystem_avail_bytes{job="pve-host", host="pve1", mountpoint="/"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 4m
        alertname: HostDiskWarning
        exp_alerts: []
      - eval_time: 6m
        alertname: HostDiskWarning
        exp_alerts:
          - exp_labels: {severity: warning, job: vm-host, host: kafka1, mountpoint: /}
            exp_annotations:
              summary: 'kafka1 루트 디스크 80% 초과'
              standard: MON-STD-26
          - exp_labels: {severity: warning, job: pfsense-host, host: pfsense, mountpoint: /}
            exp_annotations:
              summary: 'pfsense 루트 디스크 80% 초과'
              standard: MON-STD-26
      - eval_time: 6m
        alertname: HostDiskCritical
        exp_alerts:
          - exp_labels: {severity: critical, job: pfsense-host, host: pfsense, mountpoint: /}
            exp_annotations:
              summary: 'pfsense 루트 디스크 90% 초과. Kafka 로그 보존 · PostgreSQL 데이터 확인'
              standard: MON-STD-26

  # kafka2가 2분부터 응답 없음 → 1분 뒤. 살아 있는 브로커와 다른 호스트 대상(vm-host)은 이 알람이 아니다
  - name: Kafka 브로커가 1분째 응답이 없으면 울린다
    interval: 15s
    input_series:
      - series: 'up{job="kafka-jmx", host="kafka1", instance="172.30.0.40:7071"}'
        values: '1x30'
      - series: 'up{job="kafka-jmx", host="kafka2", instance="172.30.0.41:7071"}'
        values: '1x8 0x22'
      - series: 'up{job="vm-host", host="db", instance="172.30.0.50:9100"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 2m45s
        alertname: KafkaBrokerDown
        exp_alerts: []
      - eval_time: 3m30s
        alertname: KafkaBrokerDown
        exp_alerts:
          - exp_labels: {severity: critical, job: kafka-jmx, host: kafka2, instance: "172.30.0.41:7071"}
            exp_annotations:
              summary: 'Kafka 브로커 kafka2 1분째 응답 없음 — 한 대 더 죽으면 gpu.fault · job.lifecycle 흐름이 멈춘다'
              standard: MON-STD-23
