# 분류기 자체의 이상 (MON-STD-27). 사람용(Slack)이고 분류기 입력이 아니다.
# 분류기가 멈추면 원인 알람이 떠도 gpu.fault가 나가지 않아 자동 복구가 시작되지 않는다
groups:
  - name: classifier
    rules:
      # 분류기는 2개가 뜨고 Lease를 잡은 대장 하나만 처리한다(docs/classifier.md 7절). 「처리 중」이라고 말하는 Pod가 하나도 없으면 운다.
      # absent(... == 1)라서 「Pod 없음」 · 「긁기 실패」(시계열이 없다)와 「둘 다 떠 있는데 대장이 없음」(값이 전부 0)을 다 잡는다.
      # 3분은 대장이 바뀔 때(Lease 만료 15초 + Kafka에서 기억 복원)와 Agent 재시작 구간에 울리지 않게 둔 여유다
      - alert: ClassifierDown
        expr: absent(classifier_leader{job="classifier", cluster="monitoring"} == 1)
        for: 3m
        labels:
          severity: critical
          # absent()는 비교식이 끼면 고른 라벨을 결과에 싣지 않는다. 다른 알람과 같게 보이도록 직접 적는다
          job: classifier
          cluster: monitoring
        annotations:
          summary: '알람을 처리하는 분류기(대장)가 없거나 지표가 안 긁힌다 — gpu.fault가 나가지 않아 자동 복구가 시작되지 않는다'
          standard: MON-STD-27

      # 0인 동안 Pod 종료 신호는 전부 hold로 나간다. 메시지 반영 실패로 0이 된 경우는 재시작 전까지 돌아오지 않는다.
      # 대장만 본다: 대기 쪽은 job.lifecycle을 읽지 않아 늘 0이다
      - alert: ClassifierLifecycleUnhealthy
        expr: classifier_lifecycle_healthy{job="classifier"} == 0 and on (pod) classifier_leader{job="classifier"} == 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: '분류기({{ $labels.pod }})가 job.lifecycle을 못 읽는다 — Pod 종료 신호가 전부 hold로 나간다. 안 돌아오면 분류기 재시작'
          standard: MON-STD-27
