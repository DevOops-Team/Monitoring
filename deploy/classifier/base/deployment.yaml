# 분류기 (docs/classifier.md). Alertmanager 웹훅 → 판정 → Kafka gpu.fault
# 2개가 뜨고 Lease를 잡은 대장 하나만 처리한다. 대기 쪽은 받은 웹훅을 대장에게 넘겨준다 (7절, docs/monitoring-ha.md 3.5)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: classifier
---
# Lease는 Argo CD가 관리 대상에서 빼므로 매니페스트에 두지 않고 분류기가 직접 만든다 → create 필요(create는 이름으로 좁힐 수 없다)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: classifier
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [create]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [classifier]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: classifier
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: classifier
subjects:
  - kind: ServiceAccount
    name: classifier
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: classifier
  labels:
    app.kubernetes.io/name: classifier
spec:
  replicas: 2                     # 대장 1 + 대기 1. 둘 다 Ready이고 처리는 대장만 한다
  strategy:                       # 하나씩 바꾼다. 노드마다 하나라 여분 Pod를 띄울 자리(세 번째 노드)를 기대하지 않는다
    rollingUpdate: {maxSurge: 0, maxUnavailable: 1}
  selector:
    matchLabels:
      app.kubernetes.io/name: classifier
  template:
    metadata:
      labels:
        app.kubernetes.io/name: classifier
    spec:
      serviceAccountName: classifier          # Lease 읽기 · 쓰기에만 쓴다
      affinity:
        podAntiAffinity:                      # 두 Pod를 서로 다른 노드에
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: classifier
      securityContext:
        runAsUser: 1000
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: classifier
          # 태그는 자리 표시다. base만으로 배포하지 않는다: 실 클러스터는 Gitops overlay(monitoring/onprem/classifier)가 릴리스 태그로,
          # kind overlay는 로컬 이미지로 바꿔 쓴다
          image: ghcr.io/devoops-team/classifier:unreleased
          env:
            - {name: KAFKA_BOOTSTRAP, value: "172.30.0.40:9092,172.30.0.41:9092,172.30.0.42:9092"}
            - {name: REQUIRE_KAFKA, value: "true"}     # 브로커 주소가 빠지면 표준 출력으로만 내는 로컬 모드가 된다. 그 상태로는 뜨지 않게
            - {name: MIMIR_URL, value: "http://mimir.monitoring.svc:9009"}
            - {name: LOKI_URL, value: "http://loki.monitoring.svc:3100"}     # 작업 실패 사건의 죽은 노드를 trainer 로그에서 찾는다
            - {name: LEASE_NAME, value: classifier}    # 이 이름의 Lease를 잡은 Pod가 대장
            - name: POD_IP                             # 대장이 Lease에 적는 자기 주소. 대기 쪽이 여기로 넘겨준다
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
          ports:
            - {name: http, containerPort: 8080}
          # 포트는 바로 연다. 기억 복원은 대장이 된 뒤에 하고, 그 전의 웹훅에는 503을 준다(Alertmanager가 다시 보냄)
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
# 클러스터 안에서만 연다. Alertmanager 웹훅 주소: http://classifier.monitoring.svc:8080/alerts
apiVersion: v1
kind: Service
metadata:
  name: classifier
  labels:
    app.kubernetes.io/name: classifier
spec:
  selector:
    app.kubernetes.io/name: classifier
  ports:
    - {name: http, port: 8080, targetPort: http}
