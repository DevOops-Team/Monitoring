# 분류기 (docs/classifier.md). Alertmanager 웹훅 → 판정 → Kafka gpu.fault
apiVersion: apps/v1
kind: Deployment
metadata:
  name: classifier
  labels:
    app.kubernetes.io/name: classifier
spec:
  replicas: 1                     # 2개면 웹훅이 번갈아 들어가 중복 제거가 깨진다 (docs/classifier.md 7절)
  strategy: {type: Recreate}      # 같은 이유로 새 Pod와 옛 Pod가 동시에 받지 않게 한다
  selector:
    matchLabels:
      app.kubernetes.io/name: classifier
  template:
    metadata:
      labels:
        app.kubernetes.io/name: classifier
    spec:
      automountServiceAccountToken: false     # 쿠버네티스 API를 부르지 않는다
      securityContext:
        runAsUser: 1000
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: classifier
          # 태그는 자리 표시다. base만으로 배포하지 않는다: 실 클러스터는 Gitops overlay(monitoring/onprem/classifier)가 릴리스 태그로,
          # kind overlay는 로컬 이미지로 바꿔 쓴다
          image: ghcr.io/devoops-team/classifier:unreleased
          env:
            - {name: KAFKA_BOOTSTRAP, value: "172.30.0.40:9092,172.30.0.41:9092,172.30.0.42:9092"}
            - {name: REQUIRE_KAFKA, value: "true"}     # 브로커 주소가 빠지면 표준 출력으로만 내는 로컬 모드가 된다. 그 상태로는 뜨지 않게
            - {name: MIMIR_URL, value: "http://mimir.monitoring.svc:9009"}
          ports:
            - {name: http, containerPort: 8080}
          # 시작할 때 Kafka에서 기억을 되살린 뒤에야 포트를 연다. 그동안은 준비 안 됨
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
# 클러스터 안에서만 연다. Alertmanager 웹훅 주소: http://classifier.monitoring.svc:8080/alerts
apiVersion: v1
kind: Service
metadata:
  name: classifier
  labels:
    app.kubernetes.io/name: classifier
spec:
  selector:
    app.kubernetes.io/name: classifier
  ports:
    - {name: http, port: 8080, targetPort: http}
