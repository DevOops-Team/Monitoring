# Monitoring 이미지 CI (ADR-26 GHCR · ADR-40 버전). Data · K8s 레포 ci.yml과 같은 흐름이고 이미지는 둘이다.
#
#   이미지                                   Dockerfile                    쓰임
#   ghcr.io/devoops-team/classifier          classifier/Dockerfile         분류기, 온프레 모니터링 클러스터 (ADR-18 · ADR-29, docs/classifier.md)
#   ghcr.io/devoops-team/dcgm-hostengine     dcgm-hostengine/Dockerfile    dcgm-exporter 사이드카, EKS GPU 노드 (Xid 주입용 엔진, GPU-92)
#
#   dcgm-hostengine은 배포 봇을 쓰지 않는다: EKS 수집 층은 Gitops overlay 없이 이 레포 main을 따라가므로
#   deploy/agents/gpu/dcgm-exporter/daemonset.yaml의 태그를 손으로 올린다. GHCR 패키지는 공개(EKS에 pull secret 없음)
#
#   PR               : 테스트 + 바뀐 이미지만 빌드 · 점검 (push 안 함). 테스트와 이미지 빌드는 병렬 (GPU-282)
#   main push(머지)   : 릴리스 버전 계산 → classifier가 바뀌었으면 빌드 · 점검 · push {X.Y.Z, X.Y, main, sha-<7자리>}
#                       테스트는 다시 돌리지 않는다: develop → main PR에서 같은 트리를 이미 검사했다 (GPU-282)
#                       → 배포 봇이 Gitops overlay의 이미지를 새 digest로 바꿈 → Argo CD가 모니터링 클러스터에 반영
#                       → 버전 봇이 태그 vX.Y.Z · Release 생성
#
# 버전은 레포 단위 하나. develop → main PR 본문의 '## 릴리스 노트'에서 나온다(release-notes.yml).
#   대시보드 · 문서만 바뀐 머지도 레포 버전은 올라가지만, 이미지는 classifier가 바뀐 머지에서만 그 버전으로 올라간다.
#
# 다른 레포와 다른 점
#   - 빌드 컨텍스트가 폴더가 아니라 레포 루트다. 분류기가 발행 전 검증에 쓰는 schemas/fault-event.v1.json이 classifier/ 밖에 있다
#   - 버전 봇이 이 레포에 연결되기 전(Variable VERSION_APP_ID 없음)에는 main에서도 push · 태그를 하지 않는다.
#     태그 없이 push만 하면 매 머지가 같은 버전으로 계산돼 같은 태그를 덮어쓴다
#   - 배포 봇은 2026-11-19에 연결됐다(Variable DEPLOY_APP_ID · Environment gitops-deploy). 변수가 없으면 deploy를 건너뛴다
#
# main 필수 검사로 등록할 이름: "classifier · test" · "classifier · image" · "release-notes / release notes"
name: CI

on:
  pull_request:
  push:
    branches: [main]   # develop 커밋은 PR에서 점검 — push까지 걸면 같은 커밋이 두 번 돈다 (GPU-214)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 버전 계산 (main push에서만 release=true). 로직은 Gitops 재사용 워크플로.
  plan:
    name: version
    uses: DevOops-Team/Gitops/.github/workflows/release-plan.yml@main
    permissions:
      contents: read
      pull-requests: read

  # 이미지를 빌드(PR) · push(main push)할지: 이미지에 들어가는 파일이 이번 PR · 머지에서 바뀌었나. workflow_dispatch는 둘 다.
  #   안 바뀐 이미지는 job을 건너뛰지 않고 빌드 step만 건너뛴다: release가 image job 성공을 기다리고,
  #   "classifier · image"는 main 필수 검사다 (GPU-282)
  changes:
    name: changes
    runs-on: ubuntu-24.04
    outputs:
      classifier: ${{ steps.diff.outputs.classifier }}
      hostengine: ${{ steps.diff.outputs.hostengine }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          changed=true
          hostengine=true
          base=""
          if [ "$EVENT" = pull_request ] && git rev-parse -q --verify 'HEAD^2' >/dev/null; then
            base='HEAD^1'      # PR merge ref: 첫 부모 = base 브랜치 끝, 둘째 부모 = PR head
          elif [ "$EVENT" = push ] && [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] \
             && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base="$BEFORE"
          fi
          if [ -n "$base" ]; then
            files=$(git diff --name-only "$base" HEAD)
            printf '바뀐 파일:\n%s\n' "$files"
            grep -qE '^(classifier/|schemas/fault-event\.v1\.json$|\.dockerignore$|\.github/workflows/ci\.yml$)' <<<"$files" || changed=false
            grep -qE '^(dcgm-hostengine/|\.github/workflows/ci\.yml$)' <<<"$files" || hostengine=false
          fi
          echo "classifier=$changed" >> "$GITHUB_OUTPUT"
          echo "hostengine=$hostengine" >> "$GITHUB_OUTPUT"
          echo "### classifier 이미지 대상: $changed · dcgm-hostengine 이미지 대상: $hostengine" >> "$GITHUB_STEP_SUMMARY"

  test:
    name: classifier · test
    if: github.event_name != 'push'      # main push는 develop → main PR에서 검사한 트리 (GPU-282)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"          # Dockerfile 베이스와 같게
      - name: pip install
        working-directory: classifier
        run: pip install -r requirements-dev.txt
      - name: test
        working-directory: classifier
        run: python -m pytest -q          # schemas/examples와 같은 판정이 나오는지, 낸 이벤트가 v1 스키마를 통과하는지 포함

  image:
    name: classifier · image
    needs: [changes, plan]               # 테스트를 기다리지 않는다: PR에서는 병렬, main push에서는 테스트 없음 (GPU-282)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write                     # GHCR push (GITHUB_TOKEN)
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    env:
      IMAGE: ghcr.io/devoops-team/classifier
      LOCAL: devoops/classifier:ci
      BUILD: ${{ needs.changes.outputs.classifier == 'true' }}   # 아니면 빌드 step을 건너뛴다 (GPU-282)
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan.outputs.release == 'true' && needs.changes.outputs.classifier == 'true' && vars.VERSION_APP_ID != '' }}
    steps:
      - name: 건너뜀 (classifier 변경 없음)
        if: env.BUILD != 'true'
        run: echo "### classifier — 바뀐 파일이 없어 이미지 빌드를 건너뜀" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
        if: env.BUILD == 'true'
        with:
          fetch-depth: 0                  # 판정 표의 마지막 커밋을 찾는다
      - id: rules
        if: env.BUILD == 'true'
        name: 판정 표 버전 (Kafka 헤더 rule_version으로 나간다)
        run: echo "version=$(git log -1 --format=%h -- classifier/classifier/rules.yaml)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
        if: env.BUILD == 'true'
      # 빌드는 한 번만 (GPU-214). main 릴리스면 최종 태그 · 라벨까지 붙여 로컬에 올리고, 점검한 그 이미지를 그대로 push한다
      - id: meta
        if: env.BUILD == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.plan.outputs.version }},enable=${{ env.PUSH }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.plan.outputs.version }},enable=${{ env.PUSH }}
            type=raw,value=main,enable=${{ env.PUSH }}
            type=sha,prefix=sha-,format=short,enable=${{ env.PUSH }}
          labels: |
            org.opencontainers.image.title=classifier
            ${{ env.PUSH == 'true' && format('org.opencontainers.image.description={0}', needs.plan.outputs.description) || '' }}
      - name: 이미지 빌드
        if: env.BUILD == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: classifier/Dockerfile
          build-args: RULE_VERSION=${{ steps.rules.outputs.version }}
          platforms: linux/amd64
          load: true
          push: false
          tags: |
            ${{ env.LOCAL }}
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=classifier
          cache-to: type=gha,mode=max,scope=classifier
      - name: 이미지 점검
        if: env.BUILD == 'true'
        env:
          RULES: ${{ steps.rules.outputs.version }}
        run: |
          # 모듈 로드, 스키마 · 판정 표가 이미지 안 제자리에 있는지
          docker run --rm "$LOCAL" python -c "import classifier.app, confluent_kafka; from classifier.publish import SCHEMA_PATH; from classifier.rules import Rules; assert SCHEMA_PATH.exists(); Rules.load(); print('ok')"
          test "$(docker run --rm "$LOCAL" id -u)" = "1000"
          test "$(docker run --rm "$LOCAL" printenv RULE_VERSION)" = "$RULES"
          # 브로커 주소 없이 배포 모드로 뜨면 안 된다 (표준 출력으로만 내는 로컬 모드가 되는 것 방지)
          ! docker run --rm -e REQUIRE_KAFKA=true "$LOCAL" python -c "from classifier.app import pipeline_from_env; pipeline_from_env()" 2>/dev/null

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        name: GHCR push (점검한 이미지 그대로)
        if: env.PUSH == 'true'
        run: |
          docker push --all-tags "$IMAGE" | tee push.log
          # 태그 모두 같은 이미지라 digest도 하나 ("<tag>: digest: sha256:… size: …")
          digest=$(grep -oE 'digest: sha256:[0-9a-f]{64}' push.log | sort -u | cut -d' ' -f2)
          [ -n "$digest" ] || digest=$(docker image inspect "$LOCAL" --format '{{range .RepoDigests}}{{println .}}{{end}}' | grep "^${IMAGE}@" | head -1 | cut -d@ -f2)
          [ "$(printf '%s\n' "$digest" | wc -l)" -eq 1 ] && [ -n "$digest" ] || { echo "::error::digest를 하나로 못 정함: '$digest'"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Record digest
        if: env.PUSH == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: echo "### classifier \`${IMAGE}@${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"

  # dcgm-exporter 사이드카 엔진. 흐름은 위 classifier image와 같다(빌드 한 번 → 점검 → main 릴리스면 그 이미지를 push).
  #   GPU가 없어 엔진이 실제로 GPU를 잡는지는 여기서 못 본다(EKS에서 확인, deploy/README.md 「EKS 수집 층」)
  hostengine-image:
    name: dcgm-hostengine · image
    needs: [changes, plan]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/devoops-team/dcgm-hostengine
      LOCAL: devoops/dcgm-hostengine:ci
      BUILD: ${{ needs.changes.outputs.hostengine == 'true' }}   # 아니면 빌드 step을 건너뛴다 (GPU-282)
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan.outputs.release == 'true' && needs.changes.outputs.hostengine == 'true' && vars.VERSION_APP_ID != '' }}
    steps:
      - name: 건너뜀 (dcgm-hostengine 변경 없음)
        if: env.BUILD != 'true'
        run: echo "### dcgm-hostengine — 바뀐 파일이 없어 이미지 빌드를 건너뜀" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
        if: env.BUILD == 'true'
      - uses: docker/setup-buildx-action@v3
        if: env.BUILD == 'true'
      - id: meta
        if: env.BUILD == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.plan.outputs.version }},enable=${{ env.PUSH }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.plan.outputs.version }},enable=${{ env.PUSH }}
            type=raw,value=main,enable=${{ env.PUSH }}
            type=sha,prefix=sha-,format=short,enable=${{ env.PUSH }}
          labels: |
            org.opencontainers.image.title=dcgm-hostengine
      - name: 이미지 빌드
        if: env.BUILD == 'true'
        uses: docker/build-push-action@v6
        with:
          context: dcgm-hostengine
          platforms: linux/amd64
          load: true
          push: false
          tags: |
            ${{ env.LOCAL }}
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=dcgm-hostengine
          cache-to: type=gha,mode=max,scope=dcgm-hostengine
      - name: 이미지 점검
        if: env.BUILD == 'true'
        run: |
          # 엔진 · dcgmi가 실행되는지(GPU 없이도 버전은 나온다), 크기 기록 (GPU 노드 루트 디스크가 작다)
          docker run --rm "$LOCAL" nv-hostengine --version
          docker run --rm "$LOCAL" dcgmi --version
          echo "### dcgm-hostengine 크기 $(docker image inspect "$LOCAL" --format '{{.Size}}' | numfmt --to=iec)" >> "$GITHUB_STEP_SUMMARY"
      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: GHCR push (점검한 이미지 그대로)
        if: env.PUSH == 'true'
        run: |
          docker push --all-tags "$IMAGE" | tee push.log
          echo "### dcgm-hostengine \`${IMAGE}@$(grep -oE 'sha256:[0-9a-f]{64}' push.log | sort -u | head -1)\`" >> "$GITHUB_STEP_SUMMARY"

  # push한 이미지를 Gitops overlay에 반영한다 (ADR-23). 바꾸는 것은 overlay의 images 항목(newTag · digest)과
  #   원격 base ?ref= 태그다 (base-ref, GPU-212). 태그는 release job이 만들므로 그 뒤에 돈다.
  #   release가 건너뛰어지면(버전 봇 연결 전 · 릴리스 아님) ref는 그대로 두고 이미지만 반영한다.
  #   Variable DEPLOY_APP_ID · GITOPS_REPO · GITOPS_OVERLAY(= monitoring/onprem/classifier),
  #   비밀키는 Environment gitops-deploy(main만)의 Secret DEPLOY_APP_PRIVATE_KEY. 연결 전이거나 이미지를 안 올린 머지는 건너뛴다
  deploy:
    name: deploy
    needs: [plan, image, release]
    if: >-
      !cancelled() && needs.image.result == 'success'
      && (needs.release.result == 'success' || needs.release.result == 'skipped')
      && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.image.outputs.digest != '' && vars.DEPLOY_APP_ID != ''
    uses: DevOops-Team/Gitops/.github/workflows/update-image.yml@main
    with:
      image: ghcr.io/devoops-team/classifier
      digest: ${{ needs.image.outputs.digest }}
      overlay: ${{ vars.GITOPS_OVERLAY }}
      version: ${{ needs.plan.outputs.version }}
      base-ref: ${{ needs.release.result == 'success' && needs.plan.outputs.tag || '' }}   # 태그가 실제로 만들어졌을 때만
      app-id: ${{ vars.DEPLOY_APP_ID }}
      gitops-repo: ${{ vars.GITOPS_REPO }}
    secrets:
      DEPLOY_APP_PRIVATE_KEY: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}   # 이름으로 넘김 — 값은 Environment gitops-deploy(main만)

  # 이미지 push가 끝난 뒤 버전 봇이 태그 vX.Y.Z · Release를 만든다 (classifier가 안 바뀐 머지에서도 레포 버전은 올라간다).
  #   Variable VERSION_APP_ID, 비밀키는 Environment release(main만)의 Secret VERSION_APP_PRIVATE_KEY. 연결 전에는 건너뛴다
  release:
    name: release
    needs: [plan, image]   # dcgm-hostengine은 기다리지 않는다: 그 빌드가 실패해 release가 건너뛰어지면 deploy가 태그 없이 돈다
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan.outputs.release == 'true' && vars.VERSION_APP_ID != ''
    uses: DevOops-Team/Gitops/.github/workflows/release-publish.yml@main
    with:
      tag: ${{ needs.plan.outputs.tag }}
      notes: ${{ needs.plan.outputs.notes }}
      app-id: ${{ vars.VERSION_APP_ID }}
    secrets:
      VERSION_APP_PRIVATE_KEY: ${{ secrets.VERSION_APP_PRIVATE_KEY }}   # 이름으로 넘김 — 값은 Environment release(main만)
